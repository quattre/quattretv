<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>QuattreTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Iba por libre con un degradado azul y un verde que no eran los de
               la casa, asi que la app y el portal no parecian el mismo producto. */
            background: radial-gradient(120% 100% at 50% 0%, #141b1f 0%, #080b0d 70%);
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-logo {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 76px;
            font-weight: 700;
            color: #81ba26;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .splash-logo span {
            /* Iba en blanco y fino, asi que la app escribia el nombre de una
               forma y el icono, el splash y el portal de otra. */
            color: #81ba26;
        }

        .splash-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .splash-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(154, 214, 47, 0.18);
            border-top-color: #9ad62f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-status {
            color: #98a3a6;
            font-size: 18px;
            margin-top: 22px;
            max-width: 900px;
            text-align: center;
            line-height: 1.5;
        }

        .filete {
            width: 200px; height: 6px; border-radius: 3px; margin: 4px 0 26px;
            background: linear-gradient(90deg, #81ba26 0%, #9ad62f 100%);
        }

        .boton {
            margin-top: 26px; padding: 14px 34px; font-size: 20px;
            font-weight: 600; color: #0d1505; background: #9ad62f;
            border: 3px solid transparent; border-radius: 10px; cursor: pointer;
        }
        /* En la tele no hay raton: lo que manda es el foco del mando. */
        .boton:focus {
            outline: none; border-color: #f2f5f3;
        }
        .oculto { display: none; }
    </style>
</head>
<body>
    <div class="splash-logo">Quattre<span>TV</span></div>
    <div class="filete"></div>
    <div class="splash-subtitle">Quattre Internet SL</div>
    <div class="splash-spinner" id="rueda"></div>
    <div class="splash-status" id="splash-status">Conectando...</div>
    <button class="boton oculto" id="reintentar">Reintentar</button>

    <script>
        var BASE = 'https://iptv2.quattre.com';
        var PORTAL_URL = BASE + '/quattretv/stb/';
        var ESPERA = 8000;   // ms que se le dan al servidor para contestar

        function texto(t) { document.getElementById('splash-status').textContent = t; }

        function fallo(motivo) {
            document.getElementById('rueda').className = 'splash-spinner oculto';
            texto('No se puede conectar con QuattreTV. ' + motivo +
                  ' Comprueba que la television tiene internet.');
            var b = document.getElementById('reintentar');
            b.className = 'boton';
            b.focus();
        }

        // Antes esto redirigia a ciegas a los 1,5 segundos. Si el servidor no
        // respondia, la tele se quedaba en la pagina de error del navegador o
        // en negro, sin forma de volver. Ahora se pregunta primero.
        function intentar() {
            document.getElementById('reintentar').className = 'boton oculto';
            document.getElementById('rueda').className = 'splash-spinner';
            texto('Conectando...');

            var pet = new XMLHttpRequest();
            var resuelto = false;
            var reloj = setTimeout(function () {
                if (resuelto) return;
                resuelto = true;
                try { pet.abort(); } catch (e) {}
                fallo('El servidor no responde.');
            }, ESPERA);

            pet.onreadystatechange = function () {
                if (pet.readyState !== 4 || resuelto) return;
                resuelto = true;
                clearTimeout(reloj);
                if (pet.status >= 200 && pet.status < 500) {
                    texto('Cargando QuattreTV...');
                    window.location.href = PORTAL_URL;
                } else {
                    fallo('El servidor ha contestado con un error.');
                }
            };

            try {
                // La marca de tiempo evita que la tele conteste desde su cache.
                pet.open('GET', BASE + '/ping?t=' + new Date().getTime(), true);
                pet.send(null);
            } catch (e) {
                clearTimeout(reloj);
                resuelto = true;
                fallo('No hay conexion.');
            }
        }

        window.onload = function () {
            document.getElementById('reintentar').onclick = intentar;
            // El mando de LG manda OK como Enter sobre el elemento con el foco.
            document.getElementById('reintentar').onkeydown = function (e) {
                if (e.keyCode === 13) { intentar(); }
            };
            intentar();
        };
    </script>
</body>
</html>
