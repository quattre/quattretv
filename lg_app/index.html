<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>QuattreTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Iba por libre con un degradado azul y un verde que no eran los de
               la casa, asi que la app y el portal no parecian el mismo producto. */
            background: radial-gradient(120% 100% at 50% 0%, #141b1f 0%, #080b0d 70%);
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-logo {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 76px;
            font-weight: 700;
            color: #81ba26;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .splash-logo span {
            /* Iba en blanco y fino, asi que la app escribia el nombre de una
               forma y el icono, el splash y el portal de otra. */
            color: #81ba26;
        }

        .splash-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .splash-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(154, 214, 47, 0.18);
            border-top-color: #9ad62f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-status {
            color: #98a3a6;
            font-size: 18px;
            margin-top: 22px;
            max-width: 900px;
            text-align: center;
            line-height: 1.5;
        }

        .filete {
            width: 200px; height: 6px; border-radius: 3px; margin: 4px 0 26px;
            background: linear-gradient(90deg, #81ba26 0%, #9ad62f 100%);
        }

        .boton {
            margin-top: 26px; padding: 14px 34px; font-size: 20px;
            font-weight: 600; color: #0d1505; background: #9ad62f;
            border: 3px solid transparent; border-radius: 10px; cursor: pointer;
        }
        /* En la tele no hay raton: lo que manda es el foco del mando. */
        .boton:focus {
            outline: none; border-color: #f2f5f3;
        }
        .oculto { display: none; }
    </style>
</head>
<body>
    <div class="splash-logo">Quattre<span>TV</span></div>
    <div class="filete"></div>
    <div class="splash-subtitle">Quattre Internet SL</div>
    <div class="splash-spinner" id="rueda"></div>
    <div class="splash-status" id="splash-status">Conectando...</div>
    <button class="boton oculto" id="reintentar">Reintentar</button>

    <script>
        // Lista de servidores, en orden. Se prueban de arriba abajo y se entra
        // en el primero que conteste, asi que si uno se cae la app sigue
        // funcionando sola.
        //
        // Todos tienen que ir por HTTPS: lo exige LG para publicar, y una app
        // servida por https no puede llamar a http.
        //
        // Y no hace falta cambiar esta lista para mover a los clientes: /ping
        // devuelve la direccion del portal, asi que basta con cambiarla en el
        // servidor. Esto es solo el punto de entrada. Importa porque una vez
        // publicada, cambiar la app significa un envio nuevo a la tienda y una
        // o dos semanas de aprobacion por cada cambio.
        //
        // El orden importa: iptv2 primero porque es el unico que tiene HTTPS
        // hoy. iptv1 apunta todavia a la maquina vieja y su puerto 443 no
        // rechaza, descarta en silencio: medido, tarda 3,1 s constantes en
        // fallar. Ponerlo primero costaria esos 3 s en cada encendido hasta el
        // dia de la migracion, sin ganar nada.
        //
        // El dia que iptv1 pase a la maquina nueva y se le ponga certificado,
        // esta lista ya no hay que tocarla: pasa a ser un respaldo de verdad.
        // Y para mover a los clientes tampoco hace falta, porque /ping devuelve
        // donde esta el portal. Importa porque una vez publicada la app,
        // cambiarla es un envio nuevo y una o dos semanas de aprobacion.
        var SERVIDORES = [
            'https://iptv2.quattre.com',
            'https://iptv1.quattre.com'
        ];
        var RUTA_PORTAL = '/quattretv/stb/';
        var ESPERA = 8000;   // ms que se le dan a cada servidor para contestar

        function texto(t) { document.getElementById('splash-status').textContent = t; }

        function fallo(motivo) {
            document.getElementById('rueda').className = 'splash-spinner oculto';
            var b = document.getElementById('reintentar');
            b.className = 'boton';
            try { b.focus(); } catch (e) {}
            // Se deja el boton por si alguien tiene prisa, pero la app sigue
            // reintentando sola: nadie deberia tener que pulsar nada.
            reintentar_luego();
        }

        // Antes esto redirigia a ciegas a los 1,5 segundos. Si el servidor no
        // respondia, la tele se quedaba en la pagina de error del navegador o
        // en negro, sin forma de volver. Ahora se pregunta primero, y se
        // recorre la lista hasta que alguno conteste.
        // Orden de prueba: el que funciono la ultima vez primero.
        function orden() {
            var lista = SERVIDORES.slice(0);
            try {
                var ultimo = localStorage.getItem('ultimo_servidor');
                var i = ultimo ? lista.indexOf(ultimo) : -1;
                if (i > 0) { lista.splice(i, 1); lista.unshift(ultimo); }
            } catch (e) {}
            return lista;
        }

        function probar(indice, lista) {
            lista = lista || orden();
            if (indice >= lista.length) {
                fallo('Ningun servidor responde.');
                return;
            }

            var base = lista[indice];
            if (lista.length > 1) {
                texto('Conectando (' + (indice + 1) + ' de ' + lista.length + ')...');
            }

            var pet = new XMLHttpRequest();
            var resuelto = false;
            var reloj = setTimeout(function () {
                if (resuelto) return;
                resuelto = true;
                try { pet.abort(); } catch (e) {}
                probar(indice + 1, lista);   // ese no contesta: al siguiente
            }, ESPERA);

            pet.onreadystatechange = function () {
                if (pet.readyState !== 4 || resuelto) return;
                resuelto = true;
                clearTimeout(reloj);

                if (pet.status < 200 || pet.status >= 500) {
                    probar(indice + 1, lista);
                    return;
                }

                // Si el servidor dice a donde ir, se le hace caso. Asi se puede
                // mover a los clientes sin tocar la app.
                var destino = base + RUTA_PORTAL;
                try {
                    var js = JSON.parse(pet.responseText);
                    if (js && js.portal) { destino = js.portal; }
                } catch (e) {}

                // Se recuerda cual ha contestado para empezar por el la
                // proxima vez y ahorrarse el recorrido.
                try { localStorage.setItem('ultimo_servidor', base); } catch (e) {}

                texto('Cargando QuattreTV...');
                window.location.href = destino;
            };

            try {
                // La marca de tiempo evita que la tele conteste desde su cache.
                pet.open('GET', base + '/ping?t=' + new Date().getTime(), true);
                pet.send(null);
            } catch (e) {
                clearTimeout(reloj);
                resuelto = true;
                probar(indice + 1, lista);
            }
        }

        // Reintentos con esperas crecientes. Recorrer la lista una sola vez y
        // rendirse no vale: el fallo mas comun en una tele no es que el servidor
        // este caido, es que la app arranca antes que la red — el wifi sigue
        // negociando cuando la app ya esta preguntando. Un solo intento fallaria
        // por algo que habria funcionado tres segundos despues.
        var ESPERAS = [2000, 4000, 8000, 15000];   // ms entre vueltas
        var vuelta = 0;
        var reloj_reintento = null;

        function reintentar_luego() {
            var espera = ESPERAS[Math.min(vuelta, ESPERAS.length - 1)];
            vuelta++;
            var queda = Math.round(espera / 1000);
            texto('No se puede conectar con QuattreTV. Reintentando en ' +
                  queda + ' s... Comprueba que la television tiene internet.');
            clearTimeout(reloj_reintento);
            reloj_reintento = setTimeout(function () { intentar(true); }, espera);
        }

        function intentar(automatico) {
            clearTimeout(reloj_reintento);
            document.getElementById('reintentar').className = 'boton oculto';
            document.getElementById('rueda').className = 'splash-spinner';
            if (!automatico) { vuelta = 0; }
            texto('Conectando...');
            probar(0);
        }

        window.onload = function () {
            var boton = document.getElementById('reintentar');
            boton.onclick = function () { intentar(false); };
            // El mando de LG manda OK como Enter sobre el elemento con el foco.
            boton.onkeydown = function (e) {
                if (e.keyCode === 13) { intentar(false); }
            };

            // Si la tele avisa de que ha recuperado la red, no hay que esperar
            // al siguiente reintento: se prueba en ese mismo momento.
            if (window.addEventListener) {
                window.addEventListener('online', function () { intentar(false); }, false);
            }

            intentar(false);
        };
    </script>
</body>
</html>
