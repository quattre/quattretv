<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>QuattreTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Iba por libre con un degradado azul y un verde que no eran los de
               la casa, asi que la app y el portal no parecian el mismo producto. */
            background: radial-gradient(120% 100% at 50% 0%, #141b1f 0%, #080b0d 70%);
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-logo {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 76px;
            font-weight: 700;
            color: #81ba26;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .splash-logo span {
            color: #ffffff;
            font-weight: 300;
        }

        .splash-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .splash-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(154, 214, 47, 0.18);
            border-top-color: #9ad62f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="splash-logo">Quattre<span>TV</span></div>
    <div class="splash-subtitle">Quattre Internet SL</div>
    <div class="splash-spinner"></div>
    <div class="splash-status" id="splash-status">Conectando...</div>

    <script>
        // URL del portal
        var PORTAL_URL = 'https://iptv2.quattre.com/quattretv/stb/';

        window.onload = function () {
            document.getElementById('splash-status').textContent = 'Cargando QuattreTV...';
            // Mostrar splash 1.5 segundos y redirigir al portal
            setTimeout(function () {
                window.location.href = PORTAL_URL;
            }, 1500);
        };
    </script>
</body>
</html>
