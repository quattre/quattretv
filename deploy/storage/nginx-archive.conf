# Servir el archivo HLS y, sobre todo, LISTARLO en json: de ese listado saca el
# middleware el indice de segmentos para montar la playlist del catchup. Sin
# autoindex_format json no hay catchup.
#
# Va dentro del server{} que ya sirve el storage.

# Segmentos: una vez cerrados no cambian nunca, asi que se pueden cachear.
# La regex tiene prioridad sobre el prefijo de abajo.
location ~ ^/archive_hls/(.+\.ts)$ {
    alias /srv/archive_hls/$1;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
}

# Listado del directorio: NO se cachea, tiene que reflejar los segmentos
# nuevos segun se escriben.
location /archive_hls/ {
    alias /srv/archive_hls/;
    autoindex on;
    autoindex_format json;
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
}
