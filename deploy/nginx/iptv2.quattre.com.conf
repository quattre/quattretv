# nginx de la plataforma nueva (192.168.100.11), delante de gunicorn.
#
# Por qué así: el puerto 80 público lo ocupa el nginx de Ministra y no se toca.
# El 443 público está libre, así que la plataforma nueva se sirve por HTTPS ahí.
# Hace falta que el router mande el 443 público a 192.168.100.11.
#
#   sudo cp iptv2.quattre.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/iptv2.quattre.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream quattretv {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name iptv2.quattre.com;

    # Sitio para el reto de Let's Encrypt (ver el bloque que va en Ministra).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name iptv2.quattre.com;

    ssl_certificate     /etc/letsencrypt/live/iptv2.quattre.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv2.quattre.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Los decos mandan ficheros pequeños, pero el portal sirve HTML grande.
    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;

    access_log /var/log/nginx/iptv2.access.log;
    error_log  /var/log/nginx/iptv2.error.log;

    location /static/ {
        alias /var/www/quattretv/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /var/www/quattretv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://quattretv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Esta es la que hace que Django sepa que la petición vino por HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Las playlists de catchup y las listas largas de canales pueden tardar.
        proxy_read_timeout 120s;
    }
}
