# Bloque ADITIVO para el nginx de la máquina vieja (la que tiene el puerto 80).
#
# El problema: para emitir el certificado, Let's Encrypt pide el reto por el
# puerto 80 de iptv2.quattre.com, y ese puerto lo atiende esta máquina. No se
# toca nada de lo que ya hay: esto es un server{} nuevo que solo responde al
# nombre iptv2.quattre.com y solo hace dos cosas — pasar el reto a la máquina
# nueva y mandar todo lo demás a HTTPS.
#
#   sudo cp acme-en-ministra.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Alternativa si no se quiere tocar esta máquina: emitir el certificado con el
# reto DNS-01 (certbot --preferred-challenges dns), que no usa el puerto 80.

server {
    listen 80;
    server_name iptv2.quattre.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://192.168.100.11;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
