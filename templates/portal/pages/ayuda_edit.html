{% extends 'portal/layouts/base.html' %}

{% block title %}{{ aviso.titulo }} - QuattreTV Portal{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'portal:ayuda' %}" class="text-sm text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i> Novedades y ayuda</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2">{{ aviso.titulo }}</h1>
</div>
<div class="bg-white rounded-xl shadow-sm">
    <form method="post" enctype="multipart/form-data">
        {% include 'portal/pages/_aviso_form.html' %}
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
            <a href="{% url 'portal:ayuda' %}" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
