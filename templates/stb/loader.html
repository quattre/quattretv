<!DOCTYPE html>
<html>
<head>
    <title>QuattreTV</title>
    <script>
    function log(msg) {
        document.getElementById('msg').innerHTML = msg;
    }

    function setMacAndReload(mac) {
        mac = mac.replace(/%3A/g, ':').replace(/-/g, ':').toUpperCase().trim();
        document.cookie = 'mac=' + mac + '; path=/; max-age=31536000';
        setTimeout(function() { location.reload(); }, 200);
    }

    // Cuando el servidor nos dice que la MAC no esta dada de alta, hay que pedir
    // usuario y contrasena. Volver a leer la MAC dejaba al deco en bucle.
    var HAY_QUE_REGISTRAR = {% if registrar %}true{% else %}false{% endif %};
    var MAC_DETECTADA = '{{ mac_detectada }}';

    function initApp() {
        if (HAY_QUE_REGISTRAR) {
            showLogin();
            if (MAC_DETECTADA) {
                log('Equipo nuevo (' + MAC_DETECTADA + '). Entra con tu usuario para darlo de alta.');
            }
            return;
        }

        var mac = '';
        try {
            if (typeof(Android) !== 'undefined') {
                if (Android.getMac) mac = Android.getMac();
                else if (Android.getMAC) mac = Android.getMAC();
            }
            if (!mac && typeof(stb) !== 'undefined' && stb.GetDeviceMAC) {
                mac = stb.GetDeviceMAC();
            }
            if (!mac && typeof(gSTB) !== 'undefined' && gSTB.GetDeviceMAC) {
                mac = gSTB.GetDeviceMAC();
            }
        } catch(e) {}

        if (mac) {
            setMacAndReload(mac);
        } else {
            showLogin();
        }
    }

    function showLogin() {
        document.getElementById('auto').style.display = 'none';
        document.getElementById('login').style.display = 'block';
        // Se insiste: hay televisores que ignoran el foco pedido en el mismo
        // instante en que el campo se hace visible, y entonces no hay donde
        // escribir -- las teclas llegan a la pagina y se pierden.
        enfocar('username');
        setTimeout(function() { enfocar('username'); }, 400);
    }

    function enfocar(id) {
        var input = document.getElementById(id);
        if (!input) return;
        try { input.focus(); } catch(e) {}
    }

    // ¿Esta el foco en uno de nuestros campos?
    function campoConFoco() {
        var f = document.activeElement;
        return (f && (f.id === 'username' || f.id === 'password')) ? f : null;
    }

    // Abrir el teclado en pantalla.
    //
    // En webOS no hay ninguna orden para pedirlo: el televisor lo saca solo
    // cuando un campo de texto recibe el foco a raiz de algo que ha hecho el
    // usuario. Si el campo YA tiene el foco, volver a enfocarlo no hace nada,
    // asi que hay que soltarlo primero. Los decos si tienen orden propia y se
    // llama tambien, que no estorba.
    function abrirTeclado(input) {
        if (!input) return;
        // El soltar-y-volver-a-coger el foco es un apaño para webOS: alli el
        // teclado solo sale cuando un campo LO RECIBE, y si ya lo tenia no pasa
        // nada. En Tizen no hace falta -- el teclado sale igual -- y ademas es
        // dañino: al soltar el foco, el teclado del televisor se queda
        // escribiendo en el vacio y no llega ni una letra al campo.
        var esTizen = (typeof tizen !== 'undefined');
        if (!esTizen) {
            try { input.blur(); } catch(e) {}
        }
        try { input.focus(); } catch(e) {}
        try {
            if (typeof(gSTB) !== 'undefined' && gSTB.ShowVirtualKeyboard) {
                gSTB.ShowVirtualKeyboard();
            } else if (typeof(stb) !== 'undefined' && stb.ShowVirtualKeyboard) {
                stb.ShowVirtualKeyboard();
            }
        } catch(e) {}
    }

    function showKeyboard(inputId) {
        abrirTeclado(document.getElementById(inputId));
    }


    // Identificador propio de esta instalacion. Sin el, dos teles del mismo
    // usuario compartirian ficha y no habria forma de contar equipos ni de
    // limitarlos. Se guarda en el aparato y no cambia entre reinicios.
    function idAparato() {
        var id = '';
        try { id = localStorage.getItem('quattretv_uid') || ''; } catch(e) {}
        if (!id) {
            id = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            try { localStorage.setItem('quattretv_uid', id); } catch(e) {}
        }
        return id;
    }

    function tipoAparato() {
        var ua = (navigator.userAgent || '').toLowerCase();
        if (ua.indexOf('web0s') >= 0 || ua.indexOf('webos') >= 0) return 'lg';
        if (ua.indexOf('tizen') >= 0) return 'samsung';
        if (ua.indexOf('mag') >= 0 || typeof gSTB !== 'undefined' || typeof stb !== 'undefined') return 'mag';
        if (ua.indexOf('android') >= 0) return 'android';
        return 'web';
    }

    function doLogin() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;
        if (!user) { log('Introduce usuario'); return; }

        log('Verificando...');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '?type=stb&action=login' +
                 '&login=' + encodeURIComponent(user) +
                 '&password=' + encodeURIComponent(pass) +
                 '&device_uid=' + encodeURIComponent(idAparato()) +
                 '&device_type=' + encodeURIComponent(tipoAparato()) +
                 (MAC_DETECTADA ? '&mac=' + encodeURIComponent(MAC_DETECTADA) : ''), true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.js && data.js.mac) {
                            setMacAndReload(data.js.mac);
                        } else {
                            log(data.js && data.js.error ? data.js.error : 'Usuario incorrecto');
                        }
                    } catch(e) {
                        log('Error de respuesta');
                    }
                } else {
                    log('Error de conexion');
                }
            }
        };
        xhr.send();
    }

    // Handle remote control navigation
    // Las ultimas teclas recibidas, para el panel de diagnostico.
    var teclasVistas = [];

    function apuntarTecla(e) {
        var t = e.keyCode + (e.key && e.key.length === 1 ? " '" + e.key + "'" : '');
        teclasVistas.push(t);
        if (teclasVistas.length > 10) teclasVistas.shift();
    }

    // Se abre tecleando 0000: nadie va a un canal cero, asi que no se dispara
    // sin querer, y se puede explicar por telefono en cinco segundos.
    var marcados = '';

    function quizaDiagnostico(key) {
        if (key >= 48 && key <= 57) marcados += String(key - 48);
        else if (key >= 96 && key <= 105) marcados += String(key - 96);
        else { marcados = ''; return false; }
        if (marcados.length > 4) marcados = marcados.slice(-4);
        if (marcados === '0000') { marcados = ''; pintarDiagnostico(); return true; }
        return false;
    }

    function pintarDiagnostico() {
        var d = document.getElementById('diag');
        if (!d) return;
        var f = document.activeElement;
        var plataforma = (typeof tizen !== 'undefined') ? 'Samsung (Tizen)'
                       : (typeof webOS !== 'undefined' || navigator.userAgent.indexOf('Web0S') >= 0) ? 'LG (webOS)'
                       : (typeof gSTB !== 'undefined') ? 'deco MAG'
                       : 'navegador';
        d.innerHTML =
            'plataforma: <b>' + plataforma + '</b><br>' +
            'foco en: <b>' + (f ? (f.id || f.tagName) : 'NADA') + '</b>' +
            (f && f.value !== undefined && f.id !== 'password'
                ? '  texto: <b>"' + f.value + '"</b>' : '') + '<br>' +
            'usuario escrito: <b>"' + (document.getElementById('username') || {}).value + '"</b><br>' +
            'letras en la contraseña: <b>' +
                ((document.getElementById('password') || {}).value || '').length + '</b><br>' +
            'ultimas teclas: <b>' + (teclasVistas.join('  ') || 'ninguna') + '</b><br>' +
            'pantalla: <b>' + window.innerWidth + 'x' + window.innerHeight + '</b>';
        d.style.display = 'block';

        // Se manda al servidor para poder leerlo sin estar delante. Del campo
        // de contraseña solo viaja CUANTAS letras tiene, nunca su contenido.
        try {
            var texto = d.innerHTML.replace(/<br>/g, ' | ').replace(/<[^>]*>/g, '');
            var x = new XMLHttpRequest();
            x.open('GET', '/quattretv/stb/?type=stb&action=diag&d=' +
                   encodeURIComponent('[acceso] ' + texto), true);
            x.send();
        } catch (e) {}
    }

    document.onkeydown = function(e) {
        var key = e.keyCode;
        apuntarTecla(e);
        if (quizaDiagnostico(key)) return;
        if (document.getElementById('diag').style.display === 'block') pintarDiagnostico();

        // Red de seguridad: si llega una tecla y no hay ningun campo enfocado,
        // se enfoca el de usuario. Sin esto, en un televisor que no haya hecho
        // caso al foco inicial no se puede escribir nada y no hay forma de
        // saber por que: las teclas se pierden en silencio.
        if (!campoConFoco() && document.activeElement.tagName !== 'BUTTON') {
            enfocar('username');
        }

        var focused = document.activeElement;

        if (key == 13) { // OK button
            // Pulsar OK sobre un campo tiene que abrir el teclado. Antes
            // saltaba al campo siguiente, asi que con el mando no habia forma
            // de escribir: el teclado no salia nunca y un cliente nuevo no
            // podia ni meter su usuario. Para moverse entre campos estan las
            // flechas, y para entrar, el boton.
            if (focused.id == 'username' || focused.id == 'password') {
                abrirTeclado(focused);
            } else if (focused.tagName == 'BUTTON') {
                focused.click();
            }
        } else if (key == 38) { // Up
            if (focused.id == 'password') document.getElementById('username').focus();
            else if (focused.id == 'loginBtn') document.getElementById('password').focus();
        } else if (key == 40) { // Down
            if (focused.id == 'username') document.getElementById('password').focus();
            else if (focused.id == 'password') document.getElementById('loginBtn').focus();
        }
    };

    window.onload = function() { setTimeout(initApp, 100); };
    </script>
    <style>
        body { background: linear-gradient(180deg, #2c3134 0%, #1e2225 100%); margin: 0; padding: 0; font-family: Arial; min-height: 100vh; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { color: #81ba26; font-size: 42px; margin-bottom: 5px; }
        h2 { color: #888; font-weight: normal; font-size: 16px; margin-bottom: 40px; }
        #ayuda { color: #6d7679; font-size: 15px; margin-top: 18px; }
        #diag {
            display: none; margin-top: 22px; padding: 14px 18px;
            background: #0c1113; border: 1px solid #2b373d; border-radius: 8px;
            color: #9ad62f; font-family: monospace; font-size: 15px;
            text-align: left; line-height: 1.6; max-width: 760px;
        }
        #diag b { color: #e6ebe8; font-weight: normal; }
        #msg { color: #81ba26; font-size: 16px; margin: 15px; min-height: 20px; }
        #login { display: none; text-align: center; }
        input { font-size: 20px; padding: 12px 20px; width: 280px; margin: 8px 0; border: 2px solid #333; border-radius: 8px;
                background: #0f0f23; color: #fff; }
        input:focus { outline: none; border-color: #81ba26; }
        button { font-size: 18px; padding: 12px 50px; margin-top: 15px; background: #81ba26; color: #fff;
                 border: none; border-radius: 8px; cursor: pointer; }
        button:hover, button:focus { background: #6fa11f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QuattreTV</h1>
        <h2>Television de Quattre</h2>

        <div id="auto">
            <p style="color:#888">Conectando...</p>
        </div>

        <div id="login">
            <input type="text" id="username" placeholder="Usuario" onclick="showKeyboard('username')" onfocus="showKeyboard('username')">
            <br>
            <input type="password" id="password" placeholder="Contrasena" onclick="showKeyboard('password')" onfocus="showKeyboard('password')">
            <br>
            <button id="loginBtn" onclick="doLogin()">Entrar</button>
            <div id="ayuda">Pulsa OK sobre un campo para escribir &middot;
                Flechas para moverte &middot; OK en Entrar para acceder</div>
            <div id="msg"></div>
            <!-- Panel de diagnostico. Se enseña tecleando 0000. Existe porque
                 en un televisor ajeno -- el laboratorio remoto de Samsung, por
                 ejemplo -- no hay consola ni depurador: la unica forma de saber
                 que esta pasando es que la propia app lo escriba en pantalla y
                 alguien lo lea en voz alta. -->
            <div id="diag"></div>
        </div>
    </div>
</body>
</html>
