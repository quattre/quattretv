<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
    <title>QuattreTV</title>
    <script type="text/javascript">
    var stbAPI = null;
    var player = null;
    var htmlPlayer = null; // video HTML5 para LG/navegadores
    var allChannels = [];       // todo lo que ha llegado del servidor
    var channels = [];          // lo que se ve, ya filtrado
    var genres = [];
    var genreIdx = 0;
    var genreFilter = '';       // '' = todas las categorias
    var favOnly = false;
    var numBuffer = '';
    var numTimeout = null;
    var pinBuffer = '';
    var pinPendiente = null;
    var currentChannel = 0;
    var playingChannelIdx = -1;
    var isFullscreen = false;
    var volume = 50;
    var volTimeout = null;
    var useHTML5 = false;
    var view = "list";          // list | guide | recordings
    var guide = [];
    var guideIdx = 0;
    var guideChannel = null;
    var recordings = [];
    var recIdx = 0;
    var toastTimeout = null;
    var avisoCanal = null;
    var MOSTRAR_LOGOS = false;   // ponerlo a true cuando haya un juego completo

    function fitScreen() {
        // No se escala nada: la pagina se adapta sola al tamano del navegador.
        // Ni transform (rompe el plano de video del deco) ni zoom (obliga a
        // recomponer la pagina entera en cada repintado y lo deja lento).
    }

    function init() {
        fitScreen();
        graficosDelante();
        if (typeof gSTB !== "undefined") {
            stbAPI = gSTB;
            // El boton del engranaje abre la configuracion del propio deco, que
            // no pinta nada en manos de un cliente y ademas se superpone a la
            // imagen. Se desactiva; mas abajo se monta una combinacion para
            // poder entrar cuando haga falta.
            // Desactivar el boton de configuracion tiene un efecto util ademas
            // de evitar que el cliente entre sin querer: el deco deja de
            // quedarse la tecla y esta pasa al portal, que es lo que permite
            // contar las cinco pulsaciones.
            try { if (gSTB.EnableServiceButton) gSTB.EnableServiceButton(false); } catch(err) {}
            try { if (gSTB.EnableAppButton) gSTB.EnableAppButton(false); } catch(err) {}
            try {
                stbAPI.InitPlayer();
                stbAPI.SetTopWin(0);        // 0 = los graficos por delante
                stbAPI.SetAspect(0x10);
                stbAPI.SetPIG(1, -1, -1, -1);
                volume = stbAPI.GetVolume ? stbAPI.GetVolume() : 50;
            } catch(err) {}
        } else if (typeof stb !== "undefined") {
            stbAPI = stb;
            try { volume = stbAPI.GetVolume ? stbAPI.GetVolume() : 50; } catch(err) {}
        }

        // Try to get stbPlayerManager
        if (typeof stbPlayerManager !== "undefined" && stbPlayerManager.list && stbPlayerManager.list[0]) {
            player = stbPlayerManager.list[0];
        }

        // Si no hay API de STB, usar video HTML5
        if (!stbAPI && !player) {
            useHTML5 = true;
            htmlPlayer = document.getElementById('html5video');
            htmlPlayer.style.display = 'block';
            htmlPlayer.volume = volume / 100;
            // El archivo y las grabaciones se sirven como MPEG-TS crudo: el
            // deco lo reproduce, pero el <video> de LG no. Avisar en vez de
            // quedarse en negro.
            //
            // Pero hay dos motivos distintos para que el video falle y antes se
            // decian igual: que la television no pueda con ese formato, y que
            // no haya red. Decir "no se puede reproducir en este dispositivo"
            // cuando lo que pasa es que se ha ido el internet manda al usuario
            // a buscar el problema donde no esta.
            htmlPlayer.onerror = function() {
                var sinRed = !hayRed ||
                    (typeof navigator !== 'undefined' && navigator.onLine === false);
                if (sinRed) { seCayoLaRed(); return; }
                toast('Este contenido no se puede reproducir en este dispositivo');
            };
        }

        loadData();
    }

    // ---------- Conexion ----------
    //
    // El lanzador de la app ya resuelve el arranque sin red. Pero una vez
    // dentro no se notaba: el video se quedaba congelado con un aviso que
    // ademas mentia ("no se puede reproducir en este dispositivo" cuando lo
    // que pasaba era que no habia red), las listas dejaban de actualizarse sin
    // decir nada, y al volver la red no se recuperaba solo — habia que
    // moverse a ciegas hasta que alguna peticion volviera a funcionar.
    var hayRed = true;
    var relojRed = null;
    var vueltaRed = 0;
    var ESPERAS_RED = [2000, 4000, 8000, 15000];   // ms entre reintentos
    var TIEMPO_PETICION = 12000;                   // ms antes de dar por muerta una peticion

    function avisoRed(texto) {
        document.getElementById('sinred-detalle').innerHTML = esc(texto);
    }

    function seCayoLaRed() {
        if (!hayRed) return;      // ya estabamos avisando
        hayRed = false;
        graficosDelante();
        document.getElementById('sinred').style.display = 'block';
        vueltaRed = 0;
        reintentarRed();
    }

    function reintentarRed() {
        var espera = ESPERAS_RED[Math.min(vueltaRed, ESPERAS_RED.length - 1)];
        vueltaRed++;
        avisoRed('Reintentando en ' + Math.round(espera / 1000) +
                 ' s... Comprueba que la television tiene internet.');
        clearTimeout(relojRed);
        relojRed = setTimeout(probarRed, espera);
    }

    function probarRed() {
        avisoRed('Reintentando...');
        // El latido es la peticion mas barata que hay, y ademas de paso le
        // dice al panel que este aparato sigue vivo.
        api('type=watchdog&action=get_events', function(js) {
            if (js === null) { reintentarRed(); return; }
            volvioLaRed();
        }, true);   // silenciosa: si falla no queremos reentrar en el aviso
    }

    function volvioLaRed() {
        if (hayRed) return;
        hayRed = true;
        clearTimeout(relojRed);
        document.getElementById('sinred').style.display = 'none';

        // Recuperarse de verdad, no solo quitar el cartel: se vuelve a pedir la
        // lista (los canales pueden haber cambiado) y se arranca otra vez lo
        // que se estaba viendo. Sin esto el usuario se queda con una imagen
        // congelada y una app que parece ir, pero no va.
        var estabaViendo = playingChannelIdx;
        playingChannelIdx = -1;
        loadPage(0);
        if (isFullscreen && channels[estabaViendo >= 0 ? estabaViendo : currentChannel]) {
            var ch = channels[estabaViendo >= 0 ? estabaViendo : currentChannel];
            playChannel(ch);
            playingChannelIdx = estabaViendo >= 0 ? estabaViendo : currentChannel;
        } else if (!isFullscreen) {
            startPreview();
        }
        toast('Conexion recuperada');
    }

    function api(query, cb, silenciosa) {
        var xhr = new XMLHttpRequest();
        var resuelto = false;

        // Sin esto una peticion podia quedarse colgada para siempre y la
        // pantalla se quedaba en "Cargando..." sin decir nada nunca.
        var reloj = setTimeout(function() {
            if (resuelto) return;
            resuelto = true;
            try { xhr.abort(); } catch(err) {}
            if (!silenciosa) seCayoLaRed();
            cb(null);
        }, TIEMPO_PETICION);

        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4 || resuelto) return;
            resuelto = true;
            clearTimeout(reloj);

            if (xhr.status === 200) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    if (!hayRed) volvioLaRed();   // ha contestado: ya hay red
                    cb(r.js || {});
                    return;
                } catch(err) {}
            }
            // Status 0 es que no se ha llegado al servidor. Un 500 es que se ha
            // llegado y ha fallado alli, que no es lo mismo y no toca avisar de
            // que no hay red.
            if (xhr.status === 0 && !silenciosa) seCayoLaRed();
            cb(null);
        };

        try {
            xhr.open("GET", "?" + query + "&_t=" + Date.now(), true);
            xhr.send();
        } catch(err) {
            clearTimeout(reloj);
            resuelto = true;
            if (!silenciosa) seCayoLaRed();
            cb(null);
        }
    }

    // Contarle al servidor como es este aparato: sin esto hay que adivinar por
    // que un modelo dibuja distinto que otro.
    function contarComoSoy() {
        var d = [];
        try {
            d.push('ventana=' + window.innerWidth + 'x' + window.innerHeight);
            d.push('doc=' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight);
            d.push('pantalla=' + (screen ? screen.width + 'x' + screen.height : '?'));
            d.push('dpr=' + (window.devicePixelRatio || 1));
            d.push('api=' + (useHTML5 ? 'html5' : (player ? 'playerManager' : (stbAPI ? 'gSTB' : 'ninguna'))));
            d.push('gSTB=' + (typeof gSTB !== 'undefined'));
            d.push('pigviewport=' + !!(stbAPI && stbAPI.SetPIGViewport));
            d.push('settopwin=' + !!(stbAPI && stbAPI.SetTopWin));
        } catch(e) { d.push('error=' + e); }
        api('type=stb&action=log&diag=' + encodeURIComponent(d.join(' | ')), function() {});
    }

    function loadData() {
        contarComoSoy();
        cargarModulos();
        loadGenres();
        loadPage(0);
        // Señal de vida: sin esto, un aparato que lleva rato con un canal
        // puesto no vuelve a pedir nada y en el panel figura como apagado.
        setInterval(latido, 60000);
    }

    function latido() {
        var ch = channels[playingChannelIdx >= 0 ? playingChannelIdx : currentChannel];
        api("type=watchdog&action=get_events" + (ch ? "&ch_id=" + ch.id : ""), function() {});
    }

    // El listado va paginado de 50 en 50: antes solo se pedia la primera
    // pagina, asi que en la tele solo se veian 50 canales.
    function loadPage(page) {
        api("type=itv&action=get_ordered_list&p=" + page, function(js) {
            if (!js || !js.data) return;
            allChannels = allChannels.concat(js.data);
            applyFilters();
            if (page === 0) {
                showChannels();
                startPreview();
            } else {
                if (view === "list") showChannels();
            }
            var perPage = js.max_page_items || 50;
            if (channels.length < (js.total_items || 0) && js.data.length >= perPage) {
                loadPage(page + 1);
            }
        });
    }

    // Dos sistemas de coordenadas distintos, y mezclarlos fue el error:
    //  - El <video> de la LG es un elemento de la pagina: va en porcentajes y
    //    encaja solo con el marco del CSS.
    //  - El plano de video del deco es una capa por hardware que trabaja SIEMPRE
    //    en coordenadas de 1920x1080, independientemente de lo que mida el
    //    navegador. Ahi hay que dar pixeles de esa rejilla.
    // Las proporciones son las mismas (39 %, 11,1 %, 58,9 %), asi que el video
    // cae dentro del marco en los dos casos.
    // Proporciones del hueco, las MISMAS que usa el CSS del marco. Es el unico
    // sitio donde se tocan si se cambia el reparto de la pantalla.
    var HUECO = { x: 0.390, y: 0.111, ancho: 0.589, alto: 0.589 };

    // Rejilla del plano de video del deco. No es la resolucion del televisor:
    // es la que declaramos en init() con SetViewport, y el propio deco se
    // encarga de escalarla a lo que tenga el televisor (720p, 1080i, lo que
    // sea). Por eso vale para todas las resoluciones.
    // El plano de video va por su cuenta y es de 1920x1080 aunque el navegador
    // dibuje a 720p: son dos resoluciones distintas dentro del mismo aparato.
    // Al pasarle las de la ventana, la miniatura se iba al centro y la pantalla
    // completa se quedaba corta.
    function plano() {
        return { ancho: 1920, alto: 1080 };
    }

    function huecoDeco() {
        var p = plano();
        return {
            x: Math.round(p.ancho * HUECO.x),
            y: Math.round(p.alto * HUECO.y),
            width: Math.round(p.ancho * HUECO.ancho),
            height: Math.round(p.alto * HUECO.alto)
        };
    }

    function huecoCss() {
        return 'top:' + (HUECO.y * 100).toFixed(1) + '%;left:' + (HUECO.x * 100).toFixed(1) +
               '%;width:' + (HUECO.ancho * 100).toFixed(1) + '%;height:' +
               (HUECO.alto * 100).toFixed(1) + '%';
    }

    function setViewportPreview() {
        var r = huecoDeco();
        if (useHTML5) {
            htmlPlayer.style.cssText =
                'position:fixed;' + huecoCss() + ';z-index:2;border-radius:14px;';
        } else if (stbAPI) {
            // Ojo al orden: SetViewport es (ancho, alto, x, y).
            try {
                stbAPI.SetTopWin(0);
                stbAPI.SetViewport(r.width, r.height, r.x, r.y);
            } catch(err) {}
        } else if (player) {
            try {
                player.fullscreen = false;
                player.aspectConversion = 1;
                player.setViewport(r);
            } catch(err) {}
        }
    }

    function setViewportFullscreen() {
        if (useHTML5) {
            htmlPlayer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;';
        } else if (stbAPI) {
            // Asi lo hace el portal de siempre: PIG en modo 1 con el resto en
            // -1 (dejar como esta), y los graficos por delante.
            try {
                stbAPI.SetTopWin(0);
                stbAPI.SetPIG(1, -1, -1, -1);
            } catch(err) {}
        } else if (player) {
            try {
                player.fullscreen = true;
                player.setViewport({x: 0, y: 0, width: plano().ancho, height: plano().alto});
            } catch(err) {}
        }
    }

    function playChannel(ch) {
        if (useHTML5) {
            var url = ch.cmd.replace('ffmpeg ', '').replace('ffrt ', '');
            htmlPlayer.src = url;
            htmlPlayer.play().catch(function(e) { console.log('Play error:', e); });
        } else if (stbAPI) {
            try { stbAPI.Play(ch.cmd); } catch(err) {}
        } else if (player) {
            try { player.play({uri: ch.cmd}); } catch(err) {}
        }
        document.body.style.background = "transparent";

        // Avisar del cambio de canal, pero no en cada pulsacion: haciendo
        // zapping serian muchas peticiones seguidas y el deco se atasca. Se
        // manda cuando se ha quedado quieto un par de segundos.
        if (ch && ch.id) {
            clearTimeout(avisoCanal);
            avisoCanal = setTimeout(function() {
                api("type=watchdog&action=get_events&ch_id=" + ch.id, function() {});
            }, 2000);
        }
    }

    function startPreview() {
        if (channels.length === 0 || isFullscreen) return;
        var ch = channels[currentChannel];
        if (ch && ch.locked) {
            // No se previsualiza un canal bloqueado: seria enseñarlo igual.
            document.getElementById("preview").innerHTML = 'Canal bloqueado - pulsa OK e introduce el PIN';
            return;
        }
        if (!ch || !ch.cmd) return;
        document.getElementById("preview").innerHTML = '';

        // Si ya está reproduciendo el mismo canal, solo cambiar viewport
        if (playingChannelIdx === currentChannel) {
            setViewportPreview();
        } else {
            // Cambiar de canal
            setViewportPreview();
            playChannel(ch);
            playingChannelIdx = currentChannel;
        }
    }

    function iniciales(nombre) {
        var limpio = (nombre || '').replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ ]/g, '').trim();
        var partes = limpio.split(/\s+/);
        if (partes.length > 1 && partes[1]) {
            return (partes[0].charAt(0) + partes[1].charAt(0)).toUpperCase();
        }
        return limpio.substring(0, 2).toUpperCase();
    }

    function esc(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- Filtros: categoria y favoritos ----------

    function applyFilters() {
        var anterior = channels[currentChannel] ? channels[currentChannel].id : null;

        channels = [];
        for (var i = 0; i < allChannels.length; i++) {
            var c = allChannels[i];
            if (genreFilter && String(c.genre_id) !== String(genreFilter)) continue;
            if (favOnly && !c.fav) continue;
            channels.push(c);
        }

        // Mantener el canal que estaba puesto si sigue estando en la lista.
        currentChannel = 0;
        if (anterior !== null) {
            for (var j = 0; j < channels.length; j++) {
                if (channels[j].id === anterior) { currentChannel = j; break; }
            }
        }
    }

    function loadGenres() {
        api("type=itv&action=get_genres", function(js) {
            var lista = [];
            if (js && js.length) lista = js;
            else if (js && js.data) lista = js.data;
            genres = [{id: '', title: 'Todos los canales'}].concat(lista);
        });
    }

    function openGenres() {
        if (genres.length === 0) { toast('No hay categorias'); return; }
        view = "genres";
        genreIdx = 0;
        for (var i = 0; i < genres.length; i++) {
            if (String(genres[i].id) === String(genreFilter)) { genreIdx = i; break; }
        }
        renderGenres();
    }

    function renderGenres() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Categorias</div></div>';
        h += '<div class="list">';
        var visible = 11;
        var start = Math.max(0, genreIdx - 5);
        var end = Math.min(genres.length, start + visible);
        if (end - start < visible) start = Math.max(0, end - visible);
        for (var i = start; i < end; i++) {
            var g = genres[i];
            var cls = (i === genreIdx) ? "item sel" : "item";
            h += '<div class="' + cls + '"><div class="info"><div class="name">' +
                 esc(g.title) + (String(g.id) === String(genreFilter) ? ' <span class="live">ACTIVA</span>' : '') +
                 '</div></div></div>';
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Elegir <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function chooseGenre() {
        var g = genres[genreIdx];
        if (!g) return;
        genreFilter = g.id === '' ? '' : String(g.id);
        applyFilters();
        showChannels();
        if (channels.length === 0) toast('No hay canales en esa categoria');
        else startPreview();
    }

    function generoActual() {
        for (var i = 0; i < genres.length; i++) {
            if (String(genres[i].id) === String(genreFilter)) return genres[i].title;
        }
        return 'Categoria';
    }

    function toggleFavOnly() {
        favOnly = !favOnly;
        applyFilters();
        if (favOnly && channels.length === 0) {
            favOnly = false;
            applyFilters();
            toast('Todavia no tienes favoritos');
        } else {
            toast(favOnly ? 'Solo favoritos' : 'Todos los canales');
        }
        showChannels();
        startPreview();
    }

    function toggleFavorite() {
        var ch = channels[currentChannel];
        if (!ch) return;
        var nuevo = ch.fav ? 0 : 1;
        api("type=itv&action=set_fav&ch_id=" + ch.id + "&fav=" + nuevo, function(js) {
            if (js && js.result) {
                ch.fav = nuevo;
                toast(nuevo ? 'Anadido a favoritos' : 'Quitado de favoritos');
                if (favOnly) applyFilters();
                showChannels();
            } else {
                toast('No se pudo guardar el favorito');
            }
        });
    }

    // ---------- Reproducir algo que no es un canal ----------

    function reproducirPantallaCompleta(url, titulo, subtitulo) {
        playChannel({cmd: url});
        playingChannelIdx = -1;   // ya no suena el canal de la lista
        setViewportFullscreen();
        isFullscreen = true;
        graficosDelanteInsistiendo();
        document.getElementById("content").style.display = "none";
        document.getElementById("preview").style.display = "none";
        document.getElementById("preview-cap").style.display = "none";
        document.getElementById("osd").style.display = "block";
        document.getElementById("osd").innerHTML =
            '<div class="osd-ch">' + esc(titulo) + '</div>' +
            (subtitulo ? '<div class="osd-epg">' + esc(subtitulo) + '</div>' : '');
    }

    // ---------- Menu principal ----------

    // El menu se arma con lo que el servidor dice que hay disponible: si no hay
    // grabador, la opcion de grabaciones ni aparece.
    var MENU_COMPLETO = [
        {id: 'canales',     titulo: 'Canales',        modulo: 'tv'},
        {id: 'categorias',  titulo: 'Categorias',     modulo: 'tv'},
        {id: 'favoritos',   titulo: 'Solo favoritos', modulo: 'tv'},
        {id: 'peliculas',   titulo: 'Peliculas',      modulo: 'vod'},
        {id: 'series',      titulo: 'Series',         modulo: 'vod'},
        {id: 'grabaciones', titulo: 'Mis grabaciones', modulo: 'records'}
    ];
    var MODULOS = ['tv', 'epg', 'vod', 'settings'];
    var MENU = MENU_COMPLETO.slice();

    function cargarModulos() {
        api("type=stb&action=get_modules", function(js) {
            if (js && js.result && js.result.all_modules) {
                MODULOS = js.result.all_modules;
            }
            MENU = [];
            for (var i = 0; i < MENU_COMPLETO.length; i++) {
                var op = MENU_COMPLETO[i];
                for (var j = 0; j < MODULOS.length; j++) {
                    if (MODULOS[j] === op.modulo) { MENU.push(op); break; }
                }
            }
        });
    }
    var menuIdx = 0;

    function openMenu() {
        view = "menu";
        menuIdx = 0;
        renderMenu();
    }

    function renderMenu() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Quattre TV</div></div>';
        h += '<div class="list">';
        for (var i = 0; i < MENU.length; i++) {
            var cls = (i === menuIdx) ? "item sel" : "item";
            var extra = '';
            if (MENU[i].id === 'favoritos' && favOnly) extra = ' <span class="live">ACTIVO</span>';
            h += '<div class="' + cls + '"><div class="info"><div class="name">' +
                 esc(MENU[i].titulo) + extra + '</div></div></div>';
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Entrar <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function elegirMenu() {
        var opcion = MENU[menuIdx];
        if (!opcion) return;
        if (opcion.id === 'canales') showChannels();
        else if (opcion.id === 'categorias') openGenres();
        else if (opcion.id === 'favoritos') toggleFavOnly();
        else if (opcion.id === 'peliculas') openVod();
        else if (opcion.id === 'series') openSeries();
        else if (opcion.id === 'grabaciones') openRecordings();
    }

    // ---------- Videoclub ----------

    var vod = [];
    var vodIdx = 0;
    var series = [];
    var serieIdx = 0;
    var capitulos = [];
    var capIdx = 0;
    var serieActual = null;

    function cargando(titulo) {
        document.getElementById("content").innerHTML =
            '<div class="panel"><div class="header"><div class="logo">' + esc(titulo) +
            '</div></div><div style="color:#666;padding:20px;">Cargando...</div></div>';
    }

    function openVod() {
        view = "vod";
        vodIdx = 0;
        cargando('Peliculas');
        api("type=vod&action=get_ordered_list&p=0", function(js) {
            if (view !== "vod") return;
            vod = (js && js.data) ? js.data : [];
            renderVod((js && js.error) ? js.error : null);

    function comprobarPin() {
        if (!pinBuffer) return;
        api("type=stb&action=check_pin&pin=" + encodeURIComponent(pinBuffer), function(js) {
            if (js && js.result) {
                var siguiente = pinPendiente;
                pinPendiente = null;
                pinBuffer = '';
                // Volver a pedir la lista: los canales bloqueados venian sin
                // URL y ahora el servidor ya la manda.
                allChannels = [];
                api("type=itv&action=get_ordered_list&p=0", function(js2) {
                    if (js2 && js2.data) {
                        allChannels = js2.data;
                        applyFilters();
                    }
                    showChannels();
                    if (siguiente) siguiente();
                });
            } else {
                pinBuffer = '';
                renderPin((js && js.error) ? js.error : 'PIN incorrecto');
            }
        });

    // ---------- Salto por numero de canal ----------

    function pushDigit(d) {
        numBuffer += d;
        var box = document.getElementById("numjump");
        box.innerHTML = esc(numBuffer);
        box.style.display = "block";
        clearTimeout(numTimeout);
        numTimeout = setTimeout(jumpToNumber, 1500);
    }

    function jumpToNumber() {
        var box = document.getElementById("numjump");
        box.style.display = "none";
        var objetivo = parseInt(numBuffer, 10);
        numBuffer = '';
        if (!objetivo) return;

        for (var i = 0; i < channels.length; i++) {
            if (channels[i].number === objetivo) {
                currentChannel = i;
                if (isFullscreen) {
                    playChannel(channels[i]);
                    playingChannelIdx = i;
                    mostrarOsd(channels[i]);
                } else {
                    showChannels();
                    startPreview();
                }
                return;
            }
        }
        toast('No existe el canal ' + objetivo);
    }

    function toast(msg) {

        var t = document.getElementById("toast");

        t.style.display = "block";
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() { t.style.display = "none"; }, 2500);

    // ---------- Guia de programacion ----------

    function openGuide() {
        var ch = channels[currentChannel];
        if (!ch) return;
        guideChannel = ch;
        guide = [];
        guideIdx = 0;
        view = "guide";
        document.getElementById("content").innerHTML =
            '<div class="panel"><div class="header"><div class="logo">Guia</div></div>' +
            '<div style="color:#666;padding:20px;">Cargando programacion...</div></div>';
        api("type=epg&action=get_simple_data_table&ch_id=" + ch.id, function(js) {
            if (view !== "guide") return;
            guide = (js && js.data) ? js.data : [];
            for (var i = 0; i < guide.length; i++) {
                if (guide[i].current) { guideIdx = i; break; }
            }
            renderGuide();
        });
    }

    // Que se puede hacer con el programa seleccionado. Solo se ofrece lo que de
    // verdad se puede hacer: un programa pasado se ve si el canal tiene
    // archivo, y uno futuro se graba si hay grabador. Prometer "Grabar" y
    // contestar despues que no se puede es peor que no ofrecerlo.
    //
    // Lo usan la guia y la ficha, para que no digan cosas distintas.
    function pistaGuia(p) {
        if (!p) return '';
        if (p.past) {
            return (guideChannel && guideChannel.archive)
                ? '<span>OK</span> Ver desde el archivo' : '';
        }
        if (p.rec) return '<span>OK</span> Quitar la grabacion';
        if (hayGrabaciones()) return '<span>OK</span> Grabar';
        return '';
    }

    function renderGuide() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">' + esc(guideChannel.name) + '</div>';
        h += '<div class="counter">Guia</div></div>';

        if (guide.length === 0) {
            h += '<div class="list"><div style="color:#666;padding:20px;">Sin datos de EPG para este canal</div></div>';
        } else {
            h += '<div class="list">';
            var visible = 9;
            var start = Math.max(0, guideIdx - 4);
            var end = Math.min(guide.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var p = guide[i];
                var cls = (i === guideIdx) ? "item sel" : "item";
                if (p.past) cls += " past";
                h += '<div class="' + cls + '">';
                h += '<div class="num sm">' + esc(p.t_time) + '</div>';
                h += '<div class="info"><div class="name">' + esc(p.name);
                if (p.rec) h += ' <span class="rec">REC</span>';
                if (p.current) h += ' <span class="live">AHORA</span>';
                h += '</div>';
                if (p.current) h += '<div class="bar"><i style="width:' + (p.progress || 0) + '%"></i></div>';
                h += '</div></div>';
            }
            h += '</div>';

            var sel = guide[guideIdx];
            if (sel && sel.descr) {
                // Se sigue enseñando un adelanto, pero si hay mas se dice, en
                // vez de cortar la frase por la mitad y dejar al usuario
                // pensando que la guia esta rota.
                var corto = sel.descr.length > 220;
                h += '<div class="descr">' + esc(sel.descr.substring(0, 220));
                if (corto) h += '... <span style="color:#9ad62f;">▶ ver ficha</span>';
                h += '</div>';
            }
        }

        var sel2 = guide[guideIdx];
        var hint = pistaGuia(sel2);
        if (hint) hint += ' ';
        if (sel2) hint += '<span>▶</span> Ficha ';
        h += '<div class="help">' + hint + '<span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    // ---------- Ficha del programa ----------
    //
    // En la guia la descripcion se recortaba a 220 caracteres y no habia forma
    // de leer el resto — y el servidor la manda entera. Con la flecha derecha
    // se abre la ficha completa, que es coherente con el resto del portal:
    // derecha siempre es "entrar mas adentro" (lista -> guia -> ficha).
    var fichaScroll = 0;
    var fichaScrollMax = 0;
    var PASO_FICHA = 90;        // px que se desplaza cada pulsacion

    function abrirFicha() {
        if (!guide[guideIdx]) return;
        view = "ficha";
        fichaScroll = 0;
        renderFicha();
    }

    function renderFicha() {
        var p = guide[guideIdx];
        if (!p) { showChannels(); return; }

        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">' + esc(guideChannel.name) + '</div>';
        h += '<div class="counter">Ficha</div></div>';

        h += '<div style="font-size:32px;font-weight:600;line-height:1.25;margin-bottom:10px;">' +
             esc(p.name);
        if (p.current) h += ' <span class="live">AHORA</span>';
        if (p.rec) h += ' <span class="rec">REC</span>';
        h += '</div>';

        var horario = esc(p.t_time);
        if (p.t_time_end) horario += ' - ' + esc(p.t_time_end);
        var duracion = '';
        if (p.start_timestamp && p.stop_timestamp) {
            var mins = Math.round((p.stop_timestamp - p.start_timestamp) / 60);
            if (mins > 0) duracion = ' &middot; ' + mins + ' min';
        }
        h += '<div class="ficha-datos"><b>' + horario + '</b>' + duracion;
        if (p.category) h += ' &middot; ' + esc(p.category);
        if (p.past) h += ' &middot; ya emitido';
        h += '</div>';

        var texto = p.descr ? esc(p.descr) : 'Este programa no trae descripcion.';
        h += '<div class="ficha-caja"><div class="ficha-texto" id="ficha-texto">' +
             texto + '</div><div class="ficha-mas" id="ficha-mas" style="display:none;">▼ mas</div></div>';

        var accion = pistaGuia(p);
        h += '<div class="help" id="ficha-ayuda">' + (accion ? accion + ' ' : '') +
             '<span>◀</span> Volver a la guia</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;

        // Cuanto se puede desplazar solo se sabe una vez pintado.
        var caja = document.querySelector('.ficha-caja');
        var txt = document.getElementById('ficha-texto');
        fichaScrollMax = Math.max(0, txt.offsetHeight - (caja.offsetHeight - 16));
        if (fichaScrollMax > 0) {
            document.getElementById('ficha-ayuda').innerHTML =
                '<span>▲▼</span> Desplazar ' + (accion ? accion + ' ' : '') +
                '<span>◀</span> Volver a la guia';
        }
        pintarScrollFicha();
    }

    function pintarScrollFicha() {
        var txt = document.getElementById('ficha-texto');
        if (!txt) return;
        txt.style.transform = 'translateY(-' + fichaScroll + 'px)';
        var mas = document.getElementById('ficha-mas');
        if (mas) mas.style.display = (fichaScroll < fichaScrollMax) ? 'block' : 'none';
    }

    function moverFicha(paso) {
        var antes = fichaScroll;
        fichaScroll = Math.min(fichaScrollMax, Math.max(0, fichaScroll + paso));
        if (fichaScroll !== antes) pintarScrollFicha();
    }

    function guideAction() {
        var p = guide[guideIdx];
        if (!p) return;
        if (p.past) {
            playCatchup(p);
        } else if (p.rec) {
            quitarGrabacion(p);
        } else {
            recordProgram(p);
        }
    }

    function quitarGrabacion(p) {
        api("type=pvr&action=delete_task&program_id=" + p.id, function(js) {
            if (js && js.result) {
                p.rec = 0;
                toast('Grabacion quitada');
                if (view === "guide") renderGuide();
            } else {
                toast((js && js.error) ? js.error : 'No se pudo quitar');
            }
        });
    }

    // ¿Se pueden grabar cosas? El servidor ya lo dice al arrancar, en la lista
    // de modulos: ahi solo aparece 'records' si la tarifa lo incluye y hay un
    // grabador que conteste. Preguntarselo aqui evita ofrecer al usuario algo
    // que va a terminar en un mensaje de error.
    function hayGrabaciones() {
        for (var i = 0; i < MODULOS.length; i++) {
            if (MODULOS[i] === 'records') return true;
        }
        return false;
    }

    function recordProgram(p) {
        if (!p) return;
        if (!hayGrabaciones()) {
            toast('Las grabaciones no estan disponibles');
            return;
        }
        api("type=pvr&action=create_task&program_id=" + p.id, function(js) {
            if (js && js.result) {
                p.rec = 1;
                toast('Grabacion programada: ' + p.name);
                if (view === "guide") renderGuide();
            } else {
                toast((js && js.error) ? js.error : 'No se pudo programar');
            }
        });
    }

    function playCatchup(p) {
        if (!guideChannel.archive) { toast('Este canal no tiene archivo'); return; }
        api("type=tv_archive&action=create_link&ch_id=" + guideChannel.id +
            "&utc=" + p.start_timestamp + "&lutc=" + p.stop_timestamp, function(js) {
            if (js && js.cmd) {
                reproducirPantallaCompleta(js.cmd, guideChannel.name + ' · archivo', p.name);
            } else {
                toast((js && js.error) ? js.error : 'Archivo no disponible');
            }
        });
    }

    }

    function statusLabel(s) {
        if (s === 'completed') return 'LISTA';
        if (s === 'recording') return 'GRABANDO';
        if (s === 'scheduled') return 'PROGRAMADA';
        if (s === 'failed') return 'ERROR';
        return s;
    }

    function playRecording() {
        var r = recordings[recIdx];
        if (!r) return;
        if (r.status !== 'completed') { toast('La grabacion aun no esta lista'); return; }
        api("type=pvr&action=create_link&cmd=" + r.id, function(js) {
            if (js && js.cmd) {
                reproducirPantallaCompleta(js.cmd, 'Grabacion', r.name);
            } else {
                toast((js && js.error) ? js.error : 'No se pudo reproducir');
            }
        });
    }

    function deleteRecording() {
        var r = recordings[recIdx];
        if (!r) return;
        api("type=pvr&action=delete_task&id=" + r.id, function(js) {
            if (js && js.result) {
                recordings.splice(recIdx, 1);
                if (recIdx >= recordings.length) recIdx = Math.max(0, recordings.length - 1);
                toast('Grabacion borrada');
                renderRecordings(null);
            } else {
                toast((js && js.error) ? js.error : 'No se pudo borrar');
            }
        });
    }

    function recordCurrent() {
        var ch = channels[currentChannel];
        if (!ch) return;
        api("type=itv&action=get_short_epg&ch_id=" + ch.id, function(js) {
            var list = (js && js.data) ? js.data : [];
            if (list.length === 0) { toast('Sin EPG para grabar este canal'); return; }
            recordProgram(list[0]);
        });
    }

    function updatePreviewCap(ch) {
        var cap = document.getElementById("preview-cap");
        if (!cap || !ch) return;

        // La caratula del programa que dan las fuentes de EPG. Si no llega o no
        // carga, el hueco desaparece y el texto ocupa todo, sin dejar marco
        // vacio: es lo que afeaba la lista cuando faltaba el logotipo.
        var html = '';
        if (ch.epg_icon) {
            html += '<img class="cartel" src="' + esc(ch.epg_icon) +
                    '" onerror="this.style.display=\'none\'">';
        }

        html += '<div class="txt">';
        html += '<div class="t">' + ch.number + '. ' + esc(ch.name) + '</div>';
        if (ch.cur_playing) {
            html += '<div class="e">' + esc(ch.epg_cur_start) + ' - ' + esc(ch.epg_cur_end) +
                    '  ' + esc(ch.cur_playing) + '</div>';
            html += '<div class="bar" style="max-width:520px;"><i style="width:' +
                    (ch.epg_progress || 0) + '%"></i></div>';
        }
        if (ch.epg_next) {
            html += '<div class="e">Despues: ' + esc(ch.epg_next_start) + ' ' + esc(ch.epg_next) + '</div>';
        }
        html += '</div>';
        cap.innerHTML = html;
    }

    function osdFor(ch) {
        var ahora = new Date();
        var hora = ('0' + ahora.getHours()).slice(-2) + ':' + ('0' + ahora.getMinutes()).slice(-2);

        var h = '<div class="osd-fila">';
        h += '<div class="osd-num">' + ch.number + '</div>';
        if (MOSTRAR_LOGOS && ch.logo) h += '<div class="osd-ico"><img src="' + esc(ch.logo) + '" onerror="this.style.display=0"></div>';

        h += '<div class="osd-datos">';
        h += '<div class="osd-ch">' + esc(ch.name);
        if (ch.hd) h += ' <span class="hd">HD</span>';
        // El simbolo de archivo se quitó: en la tele quedaba como una cajita
        // pequeña que no comunicaba nada, y ademas salia en casi todas las
        // filas, asi que tampoco distinguia unos canales de otros.
        h += '</div>';

        if (ch.cur_playing) {
            h += '<div class="osd-prog"><b>' + esc(ch.epg_cur_start) + ' - ' +
                 esc(ch.epg_cur_end) + '</b>' + esc(ch.cur_playing) + '</div>';
            h += '<div class="bar"><i style="width:' + (ch.epg_progress || 0) + '%"></i></div>';
        }
        if (ch.epg_next) {
            h += '<div class="osd-epg">Despues &middot; ' + esc(ch.epg_next_start) +
                 '  ' + esc(ch.epg_next) + '</div>';
        }
        h += '</div>';

        // Miniatura de lo que estan echando, al final y pegada a la derecha,
        // para que no le robe sitio al texto ni lo separe del numero de canal.
        // Desaparece sola si la fuente no la trae.
        if (ch.epg_icon) h += '<img class="osd-cartel" src="' + esc(ch.epg_icon) +
                              '" onerror="this.style.display=\'none\'">';

        h += '<div class="osd-reloj">' + hora + '</div>';
        h += '</div>';
        return h;
    }

    // La barra se retira sola: dejarla fija tapa parte de la imagen.
    var osdTimeout = null;

    // En el deco el video es una capa por hardware que puede quedar POR ENCIMA
    // del HTML, sobre todo al pasar a pantalla completa. Se reafirma que los
    // graficos van delante cada vez que hay que enseñar algo encima del video.
    function graficosDelante() {
        if (!stbAPI) return;
        try { if (stbAPI.SetTopWin) stbAPI.SetTopWin(0); } catch(err) {}
        try { if (stbAPI.SetAlphaLevel) stbAPI.SetAlphaLevel(255); } catch(err) {}
        // Hay que insistir: el aparato los vuelve a habilitar por su cuenta, y
        // por eso la configuracion se abria a la primera pulsacion.
        try { if (stbAPI.EnableServiceButton) stbAPI.EnableServiceButton(false); } catch(err) {}
        try { if (stbAPI.EnableVKButton) stbAPI.EnableVKButton(false); } catch(err) {}
    }

    // El aparato coloca su video por delante en el momento en que empieza a
    // pintar imagen, no al pedir la reproduccion. Por eso hay que insistir un
    // rato despues: si no, la barra se ve un instante y la tapa la imagen.
    function graficosDelanteInsistiendo() {
        graficosDelante();
        [400, 1500].forEach(function(ms) {
            setTimeout(graficosDelante, ms);
        });
    }

    function mostrarOsd(ch) {
        var osd = document.getElementById("osd");
        graficosDelanteInsistiendo();
        osd.innerHTML = osdFor(ch);
        osd.style.display = "block";
        clearTimeout(osdTimeout);
        osdTimeout = setTimeout(function() { osd.style.display = "none"; }, 12000);
    }

    function goFullscreen() {
        var ch = channels[currentChannel];
        if (!ch) return;
        if (ch.locked) { pedirPin(goFullscreen); return; }
        if (!ch.cmd) return;

        // Si ya está reproduciendo este canal, solo cambiar viewport
        if (playingChannelIdx === currentChannel) {
            setViewportFullscreen();
        } else {
            // Nuevo canal, reproducir
            setViewportFullscreen();
            playChannel(ch);
            playingChannelIdx = currentChannel;
        }

        isFullscreen = true;
        graficosDelanteInsistiendo();
        document.getElementById("content").style.display = "none";
        document.getElementById("preview").style.display = "none";
        document.getElementById("preview-cap").style.display = "none";
        mostrarOsd(ch);
    }

    function showMenu() {
        // Volver al menu sin parar reproduccion, solo cambiar viewport
        setViewportPreview();
        isFullscreen = false;
        document.getElementById("content").style.display = "block";
        document.getElementById("preview").style.display = "flex";
        document.getElementById("preview-cap").style.display = "block";
        clearTimeout(osdTimeout);
        document.getElementById("osd").style.display = "none";
        showChannels();
        // Si veniamos del archivo o de una grabacion, el canal ya no suena.
        if (playingChannelIdx === -1) startPreview();
    }

    function showVolume() {
        graficosDelante();
        var v = document.getElementById("vol");
        v.innerHTML = "Vol: " + volume;
        v.style.display = "block";
        clearTimeout(volTimeout);
        volTimeout = setTimeout(function() { v.style.display = "none"; }, 2000);
    }

    function adjustVolume(delta) {
        volume = Math.max(0, Math.min(100, volume + delta));
        if (useHTML5 && htmlPlayer) {
            htmlPlayer.volume = volume / 100;
        } else if (stbAPI && stbAPI.SetVolume) {
            try { stbAPI.SetVolume(volume); } catch(err) {}
        }
        showVolume();
    }

    var teclaRepetida = 0, vecesTecla = 0, relojTecla = null, teclasVistas = {};

    function accesoConfiguracion(k) {
        // Cinco pulsaciones seguidas de la misma tecla no reconocida abren la
        // configuracion del deco. Asi el cliente no entra sin querer y el
        // tecnico si puede.
        if (k === teclaRepetida) {
            vecesTecla++;
        } else {
            teclaRepetida = k;
            vecesTecla = 1;
        }
        clearTimeout(relojTecla);
        relojTecla = setTimeout(function() { vecesTecla = 0; teclaRepetida = 0; }, 3000);

        if (vecesTecla >= 5) {
            vecesTecla = 0;
            toast('Abriendo la configuracion del equipo');
            // Se para la reproduccion antes: con el video en marcha, su menu
            // queda por debajo de la imagen y no se lee.
            try { if (stbAPI && stbAPI.Stop) stbAPI.Stop(); } catch(err) {}
            playingChannelIdx = -1;
            try { if (stbAPI && stbAPI.EnableServiceButton) stbAPI.EnableServiceButton(true); } catch(err) {}
            try { if (stbAPI && stbAPI.ExecAction) stbAPI.ExecAction('setup'); } catch(err) {}
            return true;
        }

        // Apuntar las teclas que no manejamos, para saber cual es cual en cada
        // mando sin tener que ir adivinando.
        if (!teclasVistas[k]) {
            teclasVistas[k] = 1;
            api('type=stb&action=log&diag=' + encodeURIComponent('tecla=' + k), function() {});
        }
        return false;
    }

    function handleKey(e) {
        var k = e.keyCode;
        if (k === 107) { adjustVolume(5); return false; }
        if (k === 109) { adjustVolume(-5); return false; }

        // Teclas numericas: en la pantalla del PIN componen el PIN, y en el
        // resto saltan a un numero de canal.
        var digito = null;
        if (k >= 48 && k <= 57) digito = String(k - 48);
        else if (k >= 96 && k <= 105) digito = String(k - 96);

        if (digito !== null) {
            if (view === "pin") {
                if (pinBuffer.length < 10) {
                    pinBuffer += digito;
                    renderPin('');
                }
            } else {
                pushDigit(digito);
            }
            return false;
        }

        if (view === "pin") {
            if (k === 13) comprobarPin();
            else if (k === 37 || k === 8 || k === 27) { pinBuffer = ''; pinPendiente = null; showChannels(); }
            return false;
        }

        if (isFullscreen) {
            if (k === 38 || k === 33) {
                // Cambiar canal en fullscreen
                if (currentChannel > 0) {
                    currentChannel--;
                    var ch = channels[currentChannel];
                    playChannel(ch);
                    playingChannelIdx = currentChannel;
                    mostrarOsd(ch);
                }
            } else if (k === 40 || k === 34) {
                if (currentChannel < channels.length - 1) {
                    currentChannel++;
                    var ch = channels[currentChannel];
                    playChannel(ch);
                    playingChannelIdx = currentChannel;
                    mostrarOsd(ch);
                }
            } else if (k === 39 || k === 73 || k === 89) {
                // Volver a enseñar la barra sin cambiar de canal.
                mostrarOsd(channels[currentChannel]);
            } else if (k === 8 || k === 27 || k === 13) {
                showMenu();
            }
        } else if (view === "menu") {
            if (k === 38 && menuIdx > 0) { menuIdx--; renderMenu(); }
            else if (k === 40 && menuIdx < MENU.length - 1) { menuIdx++; renderMenu(); }
            else if (k === 13) elegirMenu();
            else if (k === 37 || k === 8 || k === 27) showChannels();
        } else if (view === "vod") {
            if (k === 38 && vodIdx > 0) { vodIdx--; renderVod(null); }
            else if (k === 40 && vodIdx < vod.length - 1) { vodIdx++; renderVod(null); }
            else if (k === 13) verPelicula();
            else if (k === 37 || k === 8 || k === 27) openMenu();
        } else if (view === "series") {
            if (k === 38 && serieIdx > 0) { serieIdx--; renderSeries(null); }
            else if (k === 40 && serieIdx < series.length - 1) { serieIdx++; renderSeries(null); }
            else if (k === 13) openCapitulos();
            else if (k === 37 || k === 8 || k === 27) openMenu();
        } else if (view === "capitulos") {
            if (k === 38 && capIdx > 0) { capIdx--; renderCapitulos(null); }
            else if (k === 40 && capIdx < capitulos.length - 1) { capIdx++; renderCapitulos(null); }
            else if (k === 13) verCapitulo();
            else if (k === 37 || k === 8 || k === 27) openSeries();
        } else if (view === "genres") {
            if (k === 38 && genreIdx > 0) {
                genreIdx--;
                renderGenres();
            } else if (k === 40 && genreIdx < genres.length - 1) {
                genreIdx++;
                renderGenres();
            } else if (k === 13) {
                chooseGenre();
            } else if (k === 37 || k === 8 || k === 27) {
                openMenu();
            }
        } else if (view === "guide") {
            if (k === 38 && guideIdx > 0) {
                guideIdx--;
                renderGuide();
            } else if (k === 40 && guideIdx < guide.length - 1) {
                guideIdx++;
                renderGuide();
            } else if (k === 13) {
                guideAction();
            } else if (k === 39) {
                // Derecha otra vez: la ficha completa del programa.
                abrirFicha();
            } else if (k === 82 || k === 112) {
                recordProgram(guide[guideIdx]);
            } else if (k === 37 || k === 8 || k === 27) {
                showChannels();
            }
        } else if (view === "ficha") {
            if (k === 38) moverFicha(-PASO_FICHA);
            else if (k === 40) moverFicha(PASO_FICHA);
            else if (k === 33) moverFicha(-PASO_FICHA * 4);       // pagina arriba
            else if (k === 34) moverFicha(PASO_FICHA * 4);        // pagina abajo
            else if (k === 13) { view = "guide"; renderGuide(); guideAction(); }
            else if (k === 37 || k === 8 || k === 27 || k === 39) {
                view = "guide";
                renderGuide();
            }
        } else if (view === "recordings") {
            if (k === 38 && recIdx > 0) {
                recIdx--;
                renderRecordings(null);
            } else if (k === 40 && recIdx < recordings.length - 1) {
                recIdx++;
                renderRecordings(null);
            } else if (k === 13) {
                var sel = recordings[recIdx];
                if (sel && sel.status === 'completed') playRecording();
                else deleteRecording();
            } else if (k === 39 || k === 82 || k === 112) {
                deleteRecording();
            } else if (k === 37 || k === 8 || k === 27) {
                showChannels();
            }
        } else {
            if (k === 38 && currentChannel > 0) {
                currentChannel--;
                showChannels();
                startPreview();
            } else if (k === 40 && currentChannel < channels.length - 1) {
                currentChannel++;
                showChannels();
                startPreview();
            } else if (k === 13 && channels.length > 0) {
                goFullscreen();
            } else if (k === 39 && channels.length > 0) {
                openGuide();
            } else if (k === 37) {
                openMenu();
            } else if (k === 82 || k === 112) {
                recordCurrent();
            } else if (k === 113 || k === 83) {
                openRecordings();
            } else if (k === 114) {
                toggleFavOnly();
            } else if (k === 115) {
                toggleFavorite();
            } else {
                accesoConfiguracion(k);
            }
        }
        return false;
    }

    document.onkeydown = handleKey;
    window.onresize = fitScreen;
    window.onload = init;

    // La television avisa cuando pierde y cuando recupera la red. Hacerle caso
    // vale mas que esperar al siguiente reintento: en cuanto vuelve el cable,
    // se recupera en el acto en vez de tardar hasta 15 segundos.
    if (window.addEventListener) {
        window.addEventListener('offline', function() { seCayoLaRed(); }, false);
        window.addEventListener('online', function() {
            clearTimeout(relojRed);
            vueltaRed = 0;
            probarRed();
        }, false);
    }
    </script>
    <style>
        /* Identidad de Quattre: verde #81ba26 sobre carbon, titulares en Antonio.
           El fondo va casi negro y no gris: en una tele los grises medios se ven
           lavados y apagan el verde, que es justo lo que pasaba. Sobre negro el
           verde de la marca recupera fuerza sin tener que cambiarlo.
           El verde vivo (#9ad62f) es el mismo tono un punto mas claro, para los
           realces en pantalla; el de la marca se reserva al logotipo. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #080b0d;
            color: #f2f5f3;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .display { font-family: Antonio, 'Segoe UI', Arial, sans-serif; letter-spacing: .5px; }

        /* ---------- Panel lateral ---------- */
        .panel {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            position: fixed; top: 40px; left: 40px; width: 660px; height: 1000px;
            display: flex; flex-direction: column;
            background: #11171a;
            border-radius: 22px; padding: 32px 30px;
            border: 1px solid rgba(255,255,255,.06);
            box-shadow: 0 30px 90px rgba(0,0,0,.75);
        }

        .header {
            display: -webkit-box; -webkit-box-pack: justify; -webkit-box-align: center;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,.09);
        }
        .logo {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 46px; font-weight: 700; color: #81ba26;
            letter-spacing: .5px; line-height: 1;
        }
        .counter {
            background: rgba(154,214,47,.12); color: #9ad62f;
            border: 1px solid rgba(154,214,47,.22);
            padding: 8px 18px; border-radius: 22px; font-size: 19px; font-weight: 600;
        }

        /* ---------- Lista ---------- */
        .list { flex: 1; overflow: hidden; margin-bottom: 14px; }
        .item {
            display: -webkit-box; -webkit-box-align: center;
            display: flex; align-items: center; gap: 16px;
            padding: 14px 20px; margin: 7px 0; border-radius: 14px;
            background: rgba(255,255,255,.022);
            transition: background .12s;
        }
        /* Sin franja verde al lado: la seleccion se marca subiendo el contraste
           de toda la fila, que a distancia se ve mejor que un filo fino y no
           mete una linea de color en cada pantalla. */
        .item.sel {
            background: #2b373d;
            box-shadow: 0 8px 26px rgba(0,0,0,.55);
        }
        .item.sel .name { color: #fff; font-weight: 600; }
        .item.sel .epg  { color: #c4cdd0; }
        .num {
            font-family: Antonio, sans-serif;
            width: 74px; font-size: 34px; font-weight: 600; color: #5c686c;
            text-align: right; flex-shrink: 0;
        }
        .item.sel .num { color: #9ad62f; }
        .num.sm { font-size: 22px; width: 84px; color: #98a3a6; }

        .ico {
            width: 54px; height: 40px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,.06); border-radius: 8px; overflow: hidden;
        }
        .ico img { max-width: 100%; max-height: 100%; }
        .ico b {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 19px; font-weight: 600; color: #6d7679; letter-spacing: .5px;
        }

        .info { -webkit-box-flex: 1; flex: 1; overflow: hidden; }
        .name {
            font-size: 27px; font-weight: 500; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .epg {
            font-size: 17px; color: #9ba3a8; margin-top: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .epg .t { color: #6d7679; }

        /* Etiquetas */
        .hd, .rec, .live, .st {
            font-size: 12px; font-weight: 700; padding: 3px 8px;
            border-radius: 5px; margin-left: 8px; vertical-align: middle;
            letter-spacing: .5px;
        }
        .hd   { background: rgba(255,255,255,.14); color: #fff; }
        .rec  { background: #e60000; color: #fff; }
        .live { background: #9ad62f; color: #0d1505; }
        .fav  { color: #fdeb00; font-size: 19px; margin-left: 7px; }
        .arch { color: #c9d1cb; font-size: 19px; margin-left: 7px; }
        .lock { color: #ff7900; font-size: 18px; margin-left: 7px; }
        .item.past { opacity: .5; }

        .bar { height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 9px; overflow: hidden; }
        .bar i {
            display: block; height: 100%; border-radius: 3px;
            background: #9ad62f;
            background: linear-gradient(90deg, #81ba26 0%, #9ad62f 100%);
        }

        .descr {
            color: #c9d1cb; font-size: 18px; line-height: 1.5;
            padding: 16px 6px; border-top: 1px solid rgba(255,255,255,.08);
        }
        /* Ficha del programa. El texto largo no cabe en una pantalla de tele y
           no hay raton para arrastrar nada, asi que se desplaza con las flechas
           y se recorta por arriba y por abajo con una caja de altura fija. */
        .ficha-datos {
            color: #98a3a6; font-size: 19px; margin-bottom: 4px;
        }
        .ficha-datos b { color: #9ad62f; font-weight: 600; }
        .ficha-caja {
            position: relative; overflow: hidden; height: 460px;
            border-top: 1px solid rgba(255,255,255,.08);
            margin-top: 14px; padding-top: 16px;
        }
        .ficha-texto {
            color: #dfe6e0; font-size: 22px; line-height: 1.6;
            transition: transform .12s ease-out;
        }
        .ficha-mas {
            position: absolute; right: 4px; bottom: 0;
            color: #9ad62f; font-size: 17px;
            background: linear-gradient(90deg, rgba(16,22,26,0), #10161a 40%);
            padding: 4px 6px 4px 40px;
        }

        .st.completed { background: #9ad62f; color: #0d1505; }
        .st.recording { background: #e60000; color: #fff; }
        .st.scheduled { background: rgba(255,255,255,.16); color: #fff; }
        .st.failed    { background: #6d7679; color: #fff; }

        .help { text-align: center; color: #6d7679; font-size: 15px; line-height: 2; }
        .help span {
            background: rgba(255,255,255,.09); padding: 5px 11px;
            border-radius: 6px; margin: 0 5px; color: #c9d1cb; font-weight: 600;
        }

        /* ---------- Vista previa ---------- */
        #preview {
            position: fixed; top: 120px; left: 749px; width: 1131px; height: 636px;
            border-radius: 18px;
            background: transparent; z-index: 1; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: #5a6265; font-size: 26px;
        }
        /* Ojo: el JS le pone display:block en linea al mostrarla, asi que aqui
           no vale flex — el estilo en linea gana y la caratula se apilaba encima
           del texto, empujandolo fuera de la pantalla. Con flotante da igual el
           display, y ademas es lo unico seguro en el navegador del MAG520. */
        /* La miniatura de video acaba en 756; se deja aire para que el texto no
           quede pegado a ella. */
        #preview-cap { position: fixed; top: 806px; left: 749px; width: 1131px; z-index: 2; }
        /* overflow crea su propio contexto: el texto se queda en su columna en
           vez de envolver por debajo de la caratula. */
        #preview-cap .txt { overflow: hidden; }
        #preview-cap .t {
            font-family: Antonio, sans-serif;
            font-size: 40px; font-weight: 600; letter-spacing: .5px;
        }
        #preview-cap .e { font-size: 21px; color: #98a3a6; margin-top: 9px; }

        /* La caratula del programa, que ahora llega en el EPG. Cada fuente la
           manda con una forma: Movistar+ vertical 2:3 y sincroguia apaisada
           16:9. Se fija solo el alto y se deja el ancho libre, asi las dos se
           ven enteras y sin deformar. Nada de object-fit: el navegador del
           MAG520 no lo lleva. */
        .cartel {
            height: 152px; width: auto; max-width: 260px;
            float: right; margin-left: 24px;
            border-radius: 10px; display: block;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 10px 30px rgba(0,0,0,.6);
            background: #11171a;
        }

        /* ---------- Superpuestos ---------- */
        /* Barra inferior a pantalla completa. Se degrada hacia arriba para que
           el texto se lea sobre cualquier imagen sin tapar el video. */
        #osd {
            display: none; position: fixed; left: 40px; right: 40px; bottom: 40px;
            padding: 22px 34px 24px;
            background: #10161a;
            background: linear-gradient(180deg, #141b1f 0%, #0d1316 100%);
            border-radius: 14px;
            border-top: 1px solid rgba(255,255,255,.06);
            box-shadow: 0 18px 60px rgba(0,0,0,.8);
        }
        /* Centrado y no pegado al fondo: con flex-end todo lo que no fuera el
           bloque de texto se iba abajo — la caratula tenia 42 px de aire arriba
           y 24 abajo, el reloj 110 y 24 — y la barra se veia caida. */
        .osd-fila { display: -webkit-box; -webkit-box-align: center;
                    display: flex; align-items: center; gap: 26px; }
        .osd-num {
            font-family: Antonio, sans-serif;
            font-size: 78px; font-weight: 700; color: #9ad62f;
            line-height: .9; flex-shrink: 0;
        }
        /* Miniatura del programa en la barra, mismo criterio que el cartel
           grande: alto fijo y ancho libre. */
        .osd-cartel {
            height: 120px; width: auto; max-width: 214px; flex-shrink: 0;
            margin-right: 28px;
            border-radius: 8px; display: block;
            border: 1px solid rgba(255,255,255,.1);
            background: #11171a;
        }
        .osd-ico {
            width: 96px; height: 72px; flex-shrink: 0; border-radius: 10px;
            background: rgba(255,255,255,.08);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .osd-ico img { max-width: 86%; max-height: 86%; }
        .osd-datos { -webkit-box-flex: 1; flex: 1; min-width: 0; }
        .osd-ch {
            font-family: Antonio, sans-serif;
            font-size: 40px; font-weight: 600; letter-spacing: .5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .osd-prog {
            font-size: 25px; margin-top: 10px; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .osd-prog b { color: #9ad62f; font-weight: 600; margin-right: 14px; }
        .osd-epg { font-size: 19px; color: #98a3a6; margin-top: 8px; }
        #osd .bar { width: 55%; max-width: 780px; height: 7px; margin-top: 10px; }
        .osd-reloj {
            font-family: Antonio, sans-serif;
            font-size: 52px; font-weight: 600; color: #e6ebe8;
            flex-shrink: 0; line-height: 1;
        }

        #vol, #toast, #numjump {
            position: fixed; z-index: 30; display: none;
            background: #10161a;
            border: 1px solid rgba(255,255,255,.07);
            box-shadow: 0 18px 60px rgba(0,0,0,.8);
        }
        #vol {
            top: 50%; left: 50%; transform: translate(-50%,-50%);
            padding: 26px 52px; font-size: 30px; border-radius: 16px;
        }
        #toast {
            bottom: 64px; left: 50%; transform: translateX(-50%);
            padding: 20px 36px; font-size: 22px; border-radius: 14px;
        }
        #numjump {
            top: 64px; right: 72px; padding: 22px 42px;
            font-family: Antonio, sans-serif;
            font-size: 60px; font-weight: 700; letter-spacing: 6px;
            border-radius: 16px; color: #9ad62f;
        }
        /* Aviso de que se ha caido la red. Va por encima de todo, incluso de
           la pantalla completa, porque si no el usuario se queda mirando una
           imagen congelada sin saber por que. */
        #sinred {
            position: fixed; z-index: 40; display: none;
            top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: #10161a; border: 1px solid rgba(255,255,255,.07);
            box-shadow: 0 18px 60px rgba(0,0,0,.85);
            padding: 34px 54px; border-radius: 16px;
            text-align: center; max-width: 900px;
        }
        #sinred .titulo { font-size: 26px; font-weight: 600; margin-bottom: 10px; }
        #sinred .detalle { font-size: 19px; color: #98a3a6; line-height: 1.5; }

        .pinbox {
            font-family: Antonio, sans-serif;
            font-size: 56px; letter-spacing: 12px; color: #9ad62f; font-weight: 600;
            background: rgba(255,255,255,.04); border-radius: 14px;
            padding: 22px 32px; display: inline-block; min-width: 280px;
        }

        /* Aparatos que dibujan a 720p, como el MAG520. El diseno de arriba esta
           pensado para 1080p; aqui van las mismas medidas a dos tercios. Se hace
           con una consulta de medios y no con zoom: el navegador lo resuelve una
           sola vez, mientras que el zoom le obliga a recomponer la pagina en
           cada repintado y deja el aparato lento. */
        @media (max-width: 1400px) {
            .panel { top: 27px; left: 27px; width: 440px; height: 667px;
                     border-radius: 15px; padding: 21px 20px; }
            .header { margin-bottom: 15px; padding-bottom: 13px; }
            .logo { font-size: 31px; }
            .counter { padding: 6px 12px; border-radius: 15px; font-size: 13px; }

            .item { padding: 9px 14px; margin: 5px 0; border-radius: 9px; gap: 11px; }
            .num { width: 49px; font-size: 23px; }
            .num.sm { font-size: 15px; width: 56px; }
            .ico { width: 36px; height: 27px; }
            .ico b { font-size: 13px; }
            .name { font-size: 18px; }
            .epg { font-size: 11px; margin-top: 3px; }
            .hd, .rec, .live, .st { font-size: 9px; padding: 2px 5px; margin-left: 5px; }
            .fav, .arch, .lock { font-size: 13px; margin-left: 5px; }
            .bar { height: 3px; margin-top: 6px; }
            .descr { font-size: 12px; padding: 11px 4px; }
            .help { font-size: 10px; }
            .help span { padding: 3px 7px; margin: 0 3px; }

            #preview { top: 80px; left: 499px; width: 754px; height: 424px;
                       border-radius: 12px; font-size: 17px; }
            #preview-cap { top: 537px; left: 499px; width: 754px; }
            #preview-cap .t { font-size: 27px; }
            #preview-cap .e { font-size: 14px; margin-top: 6px; }
            .cartel { height: 101px; max-width: 173px; margin-left: 16px; border-radius: 7px; }
            .osd-cartel { height: 80px; max-width: 143px; margin-right: 19px; border-radius: 5px; }

            #osd { left: 27px; right: 27px; bottom: 27px;
                   padding: 14px 22px 16px; border-radius: 9px; }
            .osd-fila { gap: 14px; }
            .osd-num { font-size: 38px; }
            .osd-ico { width: 48px; height: 36px; border-radius: 5px; }
            .osd-ch { font-size: 21px; }
            .osd-prog { font-size: 15px; margin-top: 5px; }
            .osd-epg { font-size: 12px; margin-top: 4px; }
            .osd-reloj { font-size: 28px; }
            #osd .bar { width: 55%; max-width: 460px; height: 5px; margin-top: 7px; }

            #vol { padding: 17px 35px; font-size: 20px; border-radius: 11px; }
            #toast { bottom: 43px; padding: 13px 24px; font-size: 15px; border-radius: 9px; }
            #numjump { top: 43px; right: 48px; padding: 15px 28px; font-size: 40px; }
            .pinbox { font-size: 37px; letter-spacing: 8px; padding: 15px 21px; min-width: 187px; }
        }
    </style>
</head>
