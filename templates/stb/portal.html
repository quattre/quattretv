<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
    <title>QuattreTV</title>
    <script type="text/javascript">
    var stbAPI = null;
    var player = null;
    var htmlPlayer = null; // video HTML5 para LG/navegadores
    var allChannels = [];       // todo lo que ha llegado del servidor
    var channels = [];          // lo que se ve, ya filtrado
    var genres = [];
    var genreIdx = 0;
    var genreFilter = '';       // '' = todas las categorias
    var favOnly = false;
    var numBuffer = '';
    var numTimeout = null;
    var pinBuffer = '';
    var pinPendiente = null;
    var currentChannel = 0;
    var playingChannelIdx = -1;
    var isFullscreen = false;
    var volume = 50;
    var volTimeout = null;
    var useHTML5 = false;
    var view = "list";          // list | guide | recordings
    var guide = [];
    var guideIdx = 0;
    var guideChannel = null;
    var recordings = [];
    var recIdx = 0;
    var toastTimeout = null;

    function fitScreen() {
        // El surface de la app webOS ya es 1920x1080, no hace falta escalar.
        // Un transform CSS en un ancestro rompe el plano de video por hardware
        // del TV (la vista previa desaparece), por eso NO se aplica transform.
    }

    function init() {
        fitScreen();
        if (typeof gSTB !== "undefined") {
            stbAPI = gSTB;
            try {
                stbAPI.InitPlayer();
                stbAPI.SetViewport(0, 0, 1920, 1080);
                stbAPI.SetWinMode(0, 1);
                stbAPI.SetTopWin(1);
                stbAPI.SetTransparentColor(0x000000);
                volume = stbAPI.GetVolume ? stbAPI.GetVolume() : 50;
            } catch(err) {}
        } else if (typeof stb !== "undefined") {
            stbAPI = stb;
            try { volume = stbAPI.GetVolume ? stbAPI.GetVolume() : 50; } catch(err) {}
        }

        // Try to get stbPlayerManager
        if (typeof stbPlayerManager !== "undefined" && stbPlayerManager.list && stbPlayerManager.list[0]) {
            player = stbPlayerManager.list[0];
        }

        // Si no hay API de STB, usar video HTML5
        if (!stbAPI && !player) {
            useHTML5 = true;
            htmlPlayer = document.getElementById('html5video');
            htmlPlayer.style.display = 'block';
            htmlPlayer.volume = volume / 100;
            // El archivo y las grabaciones se sirven como MPEG-TS crudo: el
            // deco lo reproduce, pero el <video> de LG no. Avisar en vez de
            // quedarse en negro.
            htmlPlayer.onerror = function() {
                toast('Este contenido no se puede reproducir en este dispositivo');
            };
        }

        loadData();
    }

    function api(query, cb) {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var r = JSON.parse(xhr.responseText);
                        cb(r.js || {});
                        return;
                    } catch(err) {}
                }
                cb(null);
            }
        };
        xhr.open("GET", "?" + query + "&_t=" + Date.now(), true);
        xhr.send();
    }

    function loadData() {
        loadGenres();
        loadPage(0);
        // Señal de vida: sin esto, un aparato que lleva rato con un canal
        // puesto no vuelve a pedir nada y en el panel figura como apagado.
        setInterval(latido, 60000);
    }

    function latido() {
        var ch = channels[playingChannelIdx >= 0 ? playingChannelIdx : currentChannel];
        api("type=watchdog&action=get_events" + (ch ? "&ch_id=" + ch.id : ""), function() {});
    }

    // El listado va paginado de 50 en 50: antes solo se pedia la primera
    // pagina, asi que en la tele solo se veian 50 canales.
    function loadPage(page) {
        api("type=itv&action=get_ordered_list&p=" + page, function(js) {
            if (!js || !js.data) return;
            allChannels = allChannels.concat(js.data);
            applyFilters();
            if (page === 0) {
                showChannels();
                startPreview();
            } else {
                if (view === "list") showChannels();
            }
            var perPage = js.max_page_items || 50;
            if (channels.length < (js.total_items || 0) && js.data.length >= perPage) {
                loadPage(page + 1);
            }
        });
    }

    // El hueco del video se calcula sobre el tamano real de pantalla: la LG
    // dibuja a 1920x1080 pero el deco no tiene por que, y con coordenadas fijas
    // el video acababa donde no debia.
    function huecoPreview() {
        var an = window.innerWidth || 1920;
        var al = window.innerHeight || 1080;
        return {
            x: Math.round(an * 0.390),
            y: Math.round(al * 0.111),
            width: Math.round(an * 0.589),
            height: Math.round(al * 0.589)
        };
    }

    function setViewportPreview() {
        var r = huecoPreview();
        if (useHTML5) {
            htmlPlayer.style.cssText = 'position:fixed;top:' + r.y + 'px;left:' + r.x +
                'px;width:' + r.width + 'px;height:' + r.height + 'px;z-index:2;border-radius:14px;';
        } else if (player) {
            try {
                player.fullscreen = false;
                player.aspectConversion = 1;
                player.setViewport({x: r.x, y: r.y, width: r.width, height: r.height});
            } catch(err) {}
        } else if (stbAPI) {
            try {
                // El MAG admite el rectangulo explicito; SetPIG con tamano fijo
                // solo acertaba si la pantalla era de 1920.
                if (stbAPI.SetPIGViewport) {
                    stbAPI.SetPIGViewport(r.width, r.height, r.x, r.y);
                    stbAPI.SetPIG(0, -1, r.x, r.y);
                } else {
                    stbAPI.SetPIG(0, 128, r.x, r.y);
                }
            } catch(err) {}
        }
    }

    function setViewportFullscreen() {
        var an = window.innerWidth || 1920;
        var al = window.innerHeight || 1080;
        if (useHTML5) {
            htmlPlayer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;';
        } else if (player) {
            try {
                player.fullscreen = true;
                player.setViewport({x: 0, y: 0, width: an, height: al});
            } catch(err) {}
        } else if (stbAPI) {
            try { stbAPI.SetPIG(1, 256, 0, 0); } catch(err) {}
        }
    }

    function playChannel(ch) {
        if (useHTML5) {
            var url = ch.cmd.replace('ffmpeg ', '').replace('ffrt ', '');
            htmlPlayer.src = url;
            htmlPlayer.play().catch(function(e) { console.log('Play error:', e); });
        } else if (player) {
            try { player.play({uri: ch.cmd}); } catch(err) {}
        } else if (stbAPI) {
            try { stbAPI.Play(ch.cmd); } catch(err) {}
        }
        document.body.style.background = "transparent";
        // Avisar del cambio de canal sin esperar al siguiente latido, para que
        // el panel de streams lo refleje al momento.
        if (ch && ch.id) {
            api("type=watchdog&action=get_events&ch_id=" + ch.id, function() {});
        }
    }

    function startPreview() {
        if (channels.length === 0 || isFullscreen) return;
        var ch = channels[currentChannel];
        if (ch && ch.locked) {
            // No se previsualiza un canal bloqueado: seria enseñarlo igual.
            document.getElementById("preview").innerHTML = 'Canal bloqueado - pulsa OK e introduce el PIN';
            return;
        }
        if (!ch || !ch.cmd) return;
        document.getElementById("preview").innerHTML = '';

        // Si ya está reproduciendo el mismo canal, solo cambiar viewport
        if (playingChannelIdx === currentChannel) {
            setViewportPreview();
        } else {
            // Cambiar de canal
            setViewportPreview();
            playChannel(ch);
            playingChannelIdx = currentChannel;
        }
    }

    function esc(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- Filtros: categoria y favoritos ----------

    function applyFilters() {
        var anterior = channels[currentChannel] ? channels[currentChannel].id : null;

        channels = [];
        for (var i = 0; i < allChannels.length; i++) {
            var c = allChannels[i];
            if (genreFilter && String(c.genre_id) !== String(genreFilter)) continue;
            if (favOnly && !c.fav) continue;
            channels.push(c);
        }

        // Mantener el canal que estaba puesto si sigue estando en la lista.
        currentChannel = 0;
        if (anterior !== null) {
            for (var j = 0; j < channels.length; j++) {
                if (channels[j].id === anterior) { currentChannel = j; break; }
            }
        }
    }

    function loadGenres() {
        api("type=itv&action=get_genres", function(js) {
            var lista = [];
            if (js && js.length) lista = js;
            else if (js && js.data) lista = js.data;
            genres = [{id: '', title: 'Todos los canales'}].concat(lista);
        });
    }

    function openGenres() {
        if (genres.length === 0) { toast('No hay categorias'); return; }
        view = "genres";
        genreIdx = 0;
        for (var i = 0; i < genres.length; i++) {
            if (String(genres[i].id) === String(genreFilter)) { genreIdx = i; break; }
        }
        renderGenres();
    }

    function renderGenres() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Categorias</div></div>';
        h += '<div class="list">';
        var visible = 11;
        var start = Math.max(0, genreIdx - 5);
        var end = Math.min(genres.length, start + visible);
        if (end - start < visible) start = Math.max(0, end - visible);
        for (var i = start; i < end; i++) {
            var g = genres[i];
            var cls = (i === genreIdx) ? "item sel" : "item";
            h += '<div class="' + cls + '"><div class="info"><div class="name">' +
                 esc(g.title) + (String(g.id) === String(genreFilter) ? ' <span class="live">ACTIVA</span>' : '') +
                 '</div></div></div>';
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Elegir <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function chooseGenre() {
        var g = genres[genreIdx];
        if (!g) return;
        genreFilter = g.id === '' ? '' : String(g.id);
        applyFilters();
        showChannels();
        if (channels.length === 0) toast('No hay canales en esa categoria');
        else startPreview();
    }

    function generoActual() {
        for (var i = 0; i < genres.length; i++) {
            if (String(genres[i].id) === String(genreFilter)) return genres[i].title;
        }
        return 'Categoria';
    }

    function toggleFavOnly() {
        favOnly = !favOnly;
        applyFilters();
        if (favOnly && channels.length === 0) {
            favOnly = false;
            applyFilters();
            toast('Todavia no tienes favoritos');
        } else {
            toast(favOnly ? 'Solo favoritos' : 'Todos los canales');
        }
        showChannels();
        startPreview();
    }

    function toggleFavorite() {
        var ch = channels[currentChannel];
        if (!ch) return;
        var nuevo = ch.fav ? 0 : 1;
        api("type=itv&action=set_fav&ch_id=" + ch.id + "&fav=" + nuevo, function(js) {
            if (js && js.result) {
                ch.fav = nuevo;
                toast(nuevo ? 'Anadido a favoritos' : 'Quitado de favoritos');
                if (favOnly) applyFilters();
                showChannels();
            } else {
                toast('No se pudo guardar el favorito');
            }
        });
    }

    // ---------- Reproducir algo que no es un canal ----------

    function reproducirPantallaCompleta(url, titulo, subtitulo) {
        playChannel({cmd: url});
        playingChannelIdx = -1;   // ya no suena el canal de la lista
        setViewportFullscreen();
        isFullscreen = true;
        document.getElementById("content").style.display = "none";
        document.getElementById("preview").style.display = "none";
        document.getElementById("preview-cap").style.display = "none";
        document.getElementById("osd").style.display = "block";
        document.getElementById("osd").innerHTML =
            '<div class="osd-ch">' + esc(titulo) + '</div>' +
            (subtitulo ? '<div class="osd-epg">' + esc(subtitulo) + '</div>' : '');
    }

    // ---------- Menu principal ----------

    var MENU = [
        {id: 'canales',     titulo: 'Canales'},
        {id: 'categorias',  titulo: 'Categorias'},
        {id: 'favoritos',   titulo: 'Solo favoritos'},
        {id: 'peliculas',   titulo: 'Peliculas'},
        {id: 'series',      titulo: 'Series'},
        {id: 'grabaciones', titulo: 'Mis grabaciones'}
    ];
    var menuIdx = 0;

    function openMenu() {
        view = "menu";
        menuIdx = 0;
        renderMenu();
    }

    function renderMenu() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Quattre<span>TV</span></div></div>';
        h += '<div class="list">';
        for (var i = 0; i < MENU.length; i++) {
            var cls = (i === menuIdx) ? "item sel" : "item";
            var extra = '';
            if (MENU[i].id === 'favoritos' && favOnly) extra = ' <span class="live">ACTIVO</span>';
            h += '<div class="' + cls + '"><div class="info"><div class="name">' +
                 esc(MENU[i].titulo) + extra + '</div></div></div>';
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Entrar <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function elegirMenu() {
        var opcion = MENU[menuIdx];
        if (!opcion) return;
        if (opcion.id === 'canales') showChannels();
        else if (opcion.id === 'categorias') openGenres();
        else if (opcion.id === 'favoritos') toggleFavOnly();
        else if (opcion.id === 'peliculas') openVod();
        else if (opcion.id === 'series') openSeries();
        else if (opcion.id === 'grabaciones') openRecordings();
    }

    // ---------- Videoclub ----------

    var vod = [];
    var vodIdx = 0;
    var series = [];
    var serieIdx = 0;
    var capitulos = [];
    var capIdx = 0;
    var serieActual = null;

    function cargando(titulo) {
        document.getElementById("content").innerHTML =
            '<div class="panel"><div class="header"><div class="logo">' + esc(titulo) +
            '</div></div><div style="color:#666;padding:20px;">Cargando...</div></div>';
    }

    function openVod() {
        view = "vod";
        vodIdx = 0;
        cargando('Peliculas');
        api("type=vod&action=get_ordered_list&p=0", function(js) {
            if (view !== "vod") return;
            vod = (js && js.data) ? js.data : [];
            renderVod((js && js.error) ? js.error : null);
        });
    }

    function renderVod(error) {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Peliculas</div>';
        h += '<div class="counter">' + vod.length + '</div></div>';
        h += '<div class="list">';
        if (error) {
            h += '<div style="color:#666;padding:20px;">' + esc(error) + '</div>';
        } else if (vod.length === 0) {
            h += '<div style="color:#666;padding:20px;">No hay peliculas en el catalogo</div>';
        } else {
            var visible = 9;
            var start = Math.max(0, vodIdx - 4);
            var end = Math.min(vod.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var p = vod[i];
                var cls = (i === vodIdx) ? "item sel" : "item";
                h += '<div class="' + cls + '"><div class="info"><div class="name">' + esc(p.name);
                if (p.hd) h += ' <span class="hd">HD</span>';
                if (p.locked) h += ' <span class="lock">🔒</span>';
                h += '</div>';
                var meta = [];
                if (p.year) meta.push(p.year);
                if (p.rating_imdb) meta.push('★ ' + p.rating_imdb);
                if (p.time) meta.push(p.time + ' min');
                if (meta.length) h += '<div class="epg">' + esc(meta.join('  ·  ')) + '</div>';
                h += '</div></div>';
            }
            var sel = vod[vodIdx];
            if (sel && sel.description) {
                h += '</div><div class="descr">' + esc(sel.description.substring(0, 200)) + '</div><div class="list" style="flex:0">';
            }
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Ver <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function verPelicula() {
        var p = vod[vodIdx];
        if (!p) return;
        if (p.locked) { pedirPin(function() { openVod(); }); return; }
        api("type=vod&action=create_link&cmd=" + p.id, function(js) {
            if (js && js.cmd) {
                var meta = [];
                if (p.year) meta.push(p.year);
                if (p.time) meta.push(p.time + ' min');
                reproducirPantallaCompleta(js.cmd, p.name, meta.join('  ·  '));
            } else {
                toast((js && js.error) ? js.error : 'No se pudo reproducir');
            }
        });
    }

    function openSeries() {
        view = "series";
        serieIdx = 0;
        cargando('Series');
        api("type=series&action=get_ordered_list&p=0", function(js) {
            if (view !== "series") return;
            series = (js && js.data) ? js.data : [];
            renderSeries((js && js.error) ? js.error : null);
        });
    }

    function renderSeries(error) {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Series</div>';
        h += '<div class="counter">' + series.length + '</div></div>';
        h += '<div class="list">';
        if (error) {
            h += '<div style="color:#666;padding:20px;">' + esc(error) + '</div>';
        } else if (series.length === 0) {
            h += '<div style="color:#666;padding:20px;">No hay series en el catalogo</div>';
        } else {
            var visible = 10;
            var start = Math.max(0, serieIdx - 5);
            var end = Math.min(series.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var s = series[i];
                var cls = (i === serieIdx) ? "item sel" : "item";
                h += '<div class="' + cls + '"><div class="info"><div class="name">' + esc(s.name);
                if (s.locked) h += ' <span class="lock">🔒</span>';
                h += '</div>';
                var meta = [];
                if (s.year) meta.push(s.year);
                if (s.series) meta.push(s.series + ' temporadas');
                if (meta.length) h += '<div class="epg">' + esc(meta.join('  ·  ')) + '</div>';
                h += '</div></div>';
            }
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Capitulos <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function openCapitulos() {
        var s = series[serieIdx];
        if (!s) return;
        if (s.locked) { pedirPin(function() { openSeries(); }); return; }
        serieActual = s;
        view = "capitulos";
        capIdx = 0;
        cargando(s.name);
        api("type=series&action=get_episodes&series_id=" + s.id, function(js) {
            if (view !== "capitulos") return;
            capitulos = (js && js.data) ? js.data : [];
            renderCapitulos((js && js.error) ? js.error : null);
        });
    }

    function renderCapitulos(error) {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">' + esc(serieActual.name) + '</div>';
        h += '<div class="counter">' + capitulos.length + ' cap.</div></div>';
        h += '<div class="list">';
        if (error) {
            h += '<div style="color:#666;padding:20px;">' + esc(error) + '</div>';
        } else if (capitulos.length === 0) {
            h += '<div style="color:#666;padding:20px;">Esta serie no tiene capitulos cargados</div>';
        } else {
            var visible = 10;
            var start = Math.max(0, capIdx - 5);
            var end = Math.min(capitulos.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var cap = capitulos[i];
                var cls = (i === capIdx) ? "item sel" : "item";
                h += '<div class="' + cls + '">';
                h += '<div class="num sm">T' + cap.season + 'E' + cap.episode + '</div>';
                h += '<div class="info"><div class="name">' + esc(cap.name) + '</div></div></div>';
            }
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Ver <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function verCapitulo() {
        var cap = capitulos[capIdx];
        if (!cap) return;
        if (cap.locked) { pedirPin(function() { openSeries(); }); return; }
        api("type=series&action=create_link&cmd=" + cap.id, function(js) {
            if (js && js.cmd) {
                reproducirPantallaCompleta(js.cmd, serieActual.name, cap.label);
            } else {
                toast((js && js.error) ? js.error : 'No se pudo reproducir');
            }
        });
    }

    // ---------- Control parental ----------

    function pedirPin(despues) {
        pinBuffer = '';
        pinPendiente = despues;
        view = "pin";
        renderPin('');
    }

    function renderPin(aviso) {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Canal bloqueado</div></div>';
        h += '<div class="list"><div style="padding:30px 10px;">';
        h += '<div style="color:#99a;font-size:20px;margin-bottom:24px;">Introduce el PIN con el mando</div>';
        h += '<div class="pinbox">' + (pinBuffer.replace(/./g, '* ') || '_') + '</div>';
        if (aviso) h += '<div style="color:#e74c3c;margin-top:20px;">' + esc(aviso) + '</div>';
        h += '</div></div>';
        h += '<div class="help"><span>0-9</span> PIN <span>OK</span> Aceptar <span>◀</span> Cancelar</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function comprobarPin() {
        if (!pinBuffer) return;
        api("type=stb&action=check_pin&pin=" + encodeURIComponent(pinBuffer), function(js) {
            if (js && js.result) {
                var siguiente = pinPendiente;
                pinPendiente = null;
                pinBuffer = '';
                // Volver a pedir la lista: los canales bloqueados venian sin
                // URL y ahora el servidor ya la manda.
                allChannels = [];
                api("type=itv&action=get_ordered_list&p=0", function(js2) {
                    if (js2 && js2.data) {
                        allChannels = js2.data;
                        applyFilters();
                    }
                    showChannels();
                    if (siguiente) siguiente();
                });
            } else {
                pinBuffer = '';
                renderPin((js && js.error) ? js.error : 'PIN incorrecto');
            }
        });
    }

    // ---------- Salto por numero de canal ----------

    function pushDigit(d) {
        numBuffer += d;
        var box = document.getElementById("numjump");
        box.innerHTML = esc(numBuffer);
        box.style.display = "block";
        clearTimeout(numTimeout);
        numTimeout = setTimeout(jumpToNumber, 1500);
    }

    function jumpToNumber() {
        var box = document.getElementById("numjump");
        box.style.display = "none";
        var objetivo = parseInt(numBuffer, 10);
        numBuffer = '';
        if (!objetivo) return;

        for (var i = 0; i < channels.length; i++) {
            if (channels[i].number === objetivo) {
                currentChannel = i;
                if (isFullscreen) {
                    playChannel(channels[i]);
                    playingChannelIdx = i;
                    mostrarOsd(channels[i]);
                } else {
                    showChannels();
                    startPreview();
                }
                return;
            }
        }
        toast('No existe el canal ' + objetivo);
    }

    function showChannels() {
        view = "list";
        var ch = channels[currentChannel];
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Quattre<span>TV</span></div>';
        var etiqueta = channels.length + ' canales';
        if (favOnly) etiqueta = 'Favoritos: ' + channels.length;
        else if (genreFilter) etiqueta = generoActual() + ': ' + channels.length;
        h += '<div class="counter">' + esc(etiqueta) + '</div></div>';

        h += '<div class="list">';
        var visible = 11;
        var start = Math.max(0, currentChannel - 5);
        var end = Math.min(channels.length, start + visible);
        if (end - start < visible) start = Math.max(0, end - visible);
        for (var i = start; i < end; i++) {
            var c = channels[i];
            var cls = (i === currentChannel) ? "item sel" : "item";
            h += '<div class="' + cls + '">';
            h += '<div class="num">' + c.number + '</div>';
            if (c.logo) h += '<div class="ico"><img src="' + esc(c.logo) + '" onerror="this.style.display=0"></div>';
            h += '<div class="info"><div class="name">' + esc(c.name);
            if (c.hd) h += ' <span class="hd">HD</span>';
            if (c.fav) h += ' <span class="fav">★</span>';
            if (c.archive) h += ' <span class="arch">⟲</span>';
            if (c.locked) h += ' <span class="lock">🔒</span>';
            h += '</div>';
            if (c.cur_playing) {
                h += '<div class="epg">' + esc(c.cur_playing);
                if (c.epg_cur_end) h += ' <span class="t">hasta ' + esc(c.epg_cur_end) + '</span>';
                h += '</div>';
                h += '<div class="bar"><i style="width:' + (c.epg_progress || 0) + '%"></i></div>';
            }
            h += '</div></div>';
        }
        h += '</div>';

        h += '<div class="help"><span>OK</span> Ver <span>▶</span> Guia <span>◀</span> Menu <span>REC</span> Grabar<br>';
        h += '<span>VERDE</span> Grabaciones <span>AMARILLO</span> Favoritos <span>AZUL</span> Marcar <span>0-9</span> Ir al canal</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
        updatePreviewCap(ch);
    }

    function toast(msg) {
        var t = document.getElementById("toast");
        t.innerHTML = esc(msg);
        t.style.display = "block";
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() { t.style.display = "none"; }, 2500);
    }

    // ---------- Guia de programacion ----------

    function openGuide() {
        var ch = channels[currentChannel];
        if (!ch) return;
        guideChannel = ch;
        guide = [];
        guideIdx = 0;
        view = "guide";
        document.getElementById("content").innerHTML =
            '<div class="panel"><div class="header"><div class="logo">Guia</div></div>' +
            '<div style="color:#666;padding:20px;">Cargando programacion...</div></div>';
        api("type=epg&action=get_simple_data_table&ch_id=" + ch.id, function(js) {
            if (view !== "guide") return;
            guide = (js && js.data) ? js.data : [];
            for (var i = 0; i < guide.length; i++) {
                if (guide[i].current) { guideIdx = i; break; }
            }
            renderGuide();
        });
    }

    function renderGuide() {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">' + esc(guideChannel.name) + '</div>';
        h += '<div class="counter">Guia</div></div>';

        if (guide.length === 0) {
            h += '<div class="list"><div style="color:#666;padding:20px;">Sin datos de EPG para este canal</div></div>';
        } else {
            h += '<div class="list">';
            var visible = 9;
            var start = Math.max(0, guideIdx - 4);
            var end = Math.min(guide.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var p = guide[i];
                var cls = (i === guideIdx) ? "item sel" : "item";
                if (p.past) cls += " past";
                h += '<div class="' + cls + '">';
                h += '<div class="num sm">' + esc(p.t_time) + '</div>';
                h += '<div class="info"><div class="name">' + esc(p.name);
                if (p.rec) h += ' <span class="rec">REC</span>';
                if (p.current) h += ' <span class="live">AHORA</span>';
                h += '</div>';
                if (p.current) h += '<div class="bar"><i style="width:' + (p.progress || 0) + '%"></i></div>';
                h += '</div></div>';
            }
            h += '</div>';

            var sel = guide[guideIdx];
            if (sel && sel.descr) {
                h += '<div class="descr">' + esc(sel.descr.substring(0, 220)) + '</div>';
            }
        }

        var hint = guide.length && guide[guideIdx] && guide[guideIdx].past
            ? '<span>OK</span> Ver desde el archivo' : '<span>REC</span> Grabar';
        h += '<div class="help">' + hint + ' <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function guideAction() {
        var p = guide[guideIdx];
        if (!p) return;
        if (p.past) {
            playCatchup(p);
        } else {
            recordProgram(p);
        }
    }

    function recordProgram(p) {
        if (!p) return;
        api("type=pvr&action=create_task&program_id=" + p.id, function(js) {
            if (js && js.result) {
                p.rec = 1;
                toast('Grabacion programada: ' + p.name);
                if (view === "guide") renderGuide();
            } else {
                toast((js && js.error) ? js.error : 'No se pudo programar');
            }
        });
    }

    function playCatchup(p) {
        if (!guideChannel.archive) { toast('Este canal no tiene archivo'); return; }
        api("type=tv_archive&action=create_link&ch_id=" + guideChannel.id +
            "&utc=" + p.start_timestamp + "&lutc=" + p.stop_timestamp, function(js) {
            if (js && js.cmd) {
                reproducirPantallaCompleta(js.cmd, guideChannel.name + ' · archivo', p.name);
            } else {
                toast((js && js.error) ? js.error : 'Archivo no disponible');
            }
        });
    }

    // ---------- Grabaciones ----------

    function openRecordings() {
        view = "recordings";
        recIdx = 0;
        document.getElementById("content").innerHTML =
            '<div class="panel"><div class="header"><div class="logo">Grabaciones</div></div>' +
            '<div style="color:#666;padding:20px;">Cargando...</div></div>';
        api("type=pvr&action=get_ordered_list", function(js) {
            if (view !== "recordings") return;
            recordings = (js && js.data) ? js.data : [];
            renderRecordings((js && js.error) ? js.error : null);
        });
    }

    function renderRecordings(error) {
        var h = '<div class="panel">';
        h += '<div class="header"><div class="logo">Grabaciones</div>';
        h += '<div class="counter">' + recordings.length + '</div></div>';
        h += '<div class="list">';
        if (error) {
            h += '<div style="color:#666;padding:20px;">' + esc(error) + '</div>';
        } else if (recordings.length === 0) {
            h += '<div style="color:#666;padding:20px;">Todavia no hay grabaciones</div>';
        } else {
            var visible = 11;
            var start = Math.max(0, recIdx - 5);
            var end = Math.min(recordings.length, start + visible);
            if (end - start < visible) start = Math.max(0, end - visible);
            for (var i = start; i < end; i++) {
                var r = recordings[i];
                var cls = (i === recIdx) ? "item sel" : "item";
                h += '<div class="' + cls + '">';
                h += '<div class="num sm">' + esc(r.start_time.substring(11)) + '</div>';
                h += '<div class="info"><div class="name">' + esc(r.name);
                h += ' <span class="st ' + esc(r.status) + '">' + esc(statusLabel(r.status)) + '</span></div>';
                h += '<div class="epg">' + esc(r.ch_name) + ' · ' + esc(r.start_time) + '</div>';
                h += '</div></div>';
            }
        }
        h += '</div>';
        h += '<div class="help"><span>OK</span> Ver <span>REC</span> Borrar <span>◀</span> Volver</div>';
        h += '</div>';
        document.getElementById("content").innerHTML = h;
    }

    function statusLabel(s) {
        if (s === 'completed') return 'LISTA';
        if (s === 'recording') return 'GRABANDO';
        if (s === 'scheduled') return 'PROGRAMADA';
        if (s === 'failed') return 'ERROR';
        return s;
    }

    function playRecording() {
        var r = recordings[recIdx];
        if (!r) return;
        if (r.status !== 'completed') { toast('La grabacion aun no esta lista'); return; }
        api("type=pvr&action=create_link&cmd=" + r.id, function(js) {
            if (js && js.cmd) {
                reproducirPantallaCompleta(js.cmd, 'Grabacion', r.name);
            } else {
                toast((js && js.error) ? js.error : 'No se pudo reproducir');
            }
        });
    }

    function deleteRecording() {
        var r = recordings[recIdx];
        if (!r) return;
        api("type=pvr&action=delete_task&id=" + r.id, function(js) {
            if (js && js.result) {
                recordings.splice(recIdx, 1);
                if (recIdx >= recordings.length) recIdx = Math.max(0, recordings.length - 1);
                toast('Grabacion borrada');
                renderRecordings(null);
            } else {
                toast((js && js.error) ? js.error : 'No se pudo borrar');
            }
        });
    }

    function recordCurrent() {
        var ch = channels[currentChannel];
        if (!ch) return;
        api("type=itv&action=get_short_epg&ch_id=" + ch.id, function(js) {
            var list = (js && js.data) ? js.data : [];
            if (list.length === 0) { toast('Sin EPG para grabar este canal'); return; }
            recordProgram(list[0]);
        });
    }

    function updatePreviewCap(ch) {
        var cap = document.getElementById("preview-cap");
        if (!cap || !ch) return;
        var html = '<div class="t">' + ch.number + '. ' + esc(ch.name) + '</div>';
        if (ch.cur_playing) {
            html += '<div class="e">' + esc(ch.epg_cur_start) + ' - ' + esc(ch.epg_cur_end) +
                    '  ' + esc(ch.cur_playing) + '</div>';
            html += '<div class="bar" style="width:520px;"><i style="width:' +
                    (ch.epg_progress || 0) + '%"></i></div>';
        }
        if (ch.epg_next) {
            html += '<div class="e">Despues: ' + esc(ch.epg_next_start) + ' ' + esc(ch.epg_next) + '</div>';
        }
        cap.innerHTML = html;
    }

    function osdFor(ch) {
        var ahora = new Date();
        var hora = ('0' + ahora.getHours()).slice(-2) + ':' + ('0' + ahora.getMinutes()).slice(-2);

        var h = '<div class="osd-fila">';
        h += '<div class="osd-num">' + ch.number + '</div>';
        if (ch.logo) h += '<div class="osd-ico"><img src="' + esc(ch.logo) + '" onerror="this.style.display=0"></div>';

        h += '<div class="osd-datos">';
        h += '<div class="osd-ch">' + esc(ch.name);
        if (ch.hd) h += ' <span class="hd">HD</span>';
        if (ch.archive) h += ' <span class="arch">&#8634;</span>';
        h += '</div>';

        if (ch.cur_playing) {
            h += '<div class="osd-prog"><b>' + esc(ch.epg_cur_start) + ' - ' +
                 esc(ch.epg_cur_end) + '</b>' + esc(ch.cur_playing) + '</div>';
            h += '<div class="bar"><i style="width:' + (ch.epg_progress || 0) + '%"></i></div>';
        }
        if (ch.epg_next) {
            h += '<div class="osd-epg">Despues &middot; ' + esc(ch.epg_next_start) +
                 '  ' + esc(ch.epg_next) + '</div>';
        }
        h += '</div>';

        h += '<div class="osd-reloj">' + hora + '</div>';
        h += '</div>';
        return h;
    }

    // La barra se retira sola: dejarla fija tapa parte de la imagen.
    var osdTimeout = null;
    function mostrarOsd(ch) {
        var osd = document.getElementById("osd");
        osd.innerHTML = osdFor(ch);
        osd.style.display = "block";
        clearTimeout(osdTimeout);
        osdTimeout = setTimeout(function() { osd.style.display = "none"; }, 12000);
    }

    function goFullscreen() {
        var ch = channels[currentChannel];
        if (!ch) return;
        if (ch.locked) { pedirPin(goFullscreen); return; }
        if (!ch.cmd) return;

        // Si ya está reproduciendo este canal, solo cambiar viewport
        if (playingChannelIdx === currentChannel) {
            setViewportFullscreen();
        } else {
            // Nuevo canal, reproducir
            setViewportFullscreen();
            playChannel(ch);
            playingChannelIdx = currentChannel;
        }

        isFullscreen = true;
        document.getElementById("content").style.display = "none";
        document.getElementById("preview").style.display = "none";
        document.getElementById("preview-cap").style.display = "none";
        mostrarOsd(ch);
    }

    function showMenu() {
        // Volver al menu sin parar reproduccion, solo cambiar viewport
        setViewportPreview();
        isFullscreen = false;
        document.getElementById("content").style.display = "block";
        document.getElementById("preview").style.display = "flex";
        document.getElementById("preview-cap").style.display = "block";
        document.getElementById("osd").style.display = "none";
        showChannels();
        // Si veniamos del archivo o de una grabacion, el canal ya no suena.
        if (playingChannelIdx === -1) startPreview();
    }

    function showVolume() {
        var v = document.getElementById("vol");
        v.innerHTML = "Vol: " + volume;
        v.style.display = "block";
        clearTimeout(volTimeout);
        volTimeout = setTimeout(function() { v.style.display = "none"; }, 2000);
    }

    function adjustVolume(delta) {
        volume = Math.max(0, Math.min(100, volume + delta));
        if (useHTML5 && htmlPlayer) {
            htmlPlayer.volume = volume / 100;
        } else if (stbAPI && stbAPI.SetVolume) {
            try { stbAPI.SetVolume(volume); } catch(err) {}
        }
        showVolume();
    }

    function handleKey(e) {
        var k = e.keyCode;
        if (k === 107) { adjustVolume(5); return false; }
        if (k === 109) { adjustVolume(-5); return false; }

        // Teclas numericas: en la pantalla del PIN componen el PIN, y en el
        // resto saltan a un numero de canal.
        var digito = null;
        if (k >= 48 && k <= 57) digito = String(k - 48);
        else if (k >= 96 && k <= 105) digito = String(k - 96);

        if (digito !== null) {
            if (view === "pin") {
                if (pinBuffer.length < 10) {
                    pinBuffer += digito;
                    renderPin('');
                }
            } else {
                pushDigit(digito);
            }
            return false;
        }

        if (view === "pin") {
            if (k === 13) comprobarPin();
            else if (k === 37 || k === 8 || k === 27) { pinBuffer = ''; pinPendiente = null; showChannels(); }
            return false;
        }

        if (isFullscreen) {
            if (k === 38 || k === 33) {
                // Cambiar canal en fullscreen
                if (currentChannel > 0) {
                    currentChannel--;
                    var ch = channels[currentChannel];
                    playChannel(ch);
                    playingChannelIdx = currentChannel;
                    mostrarOsd(ch);
                }
            } else if (k === 40 || k === 34) {
                if (currentChannel < channels.length - 1) {
                    currentChannel++;
                    var ch = channels[currentChannel];
                    playChannel(ch);
                    playingChannelIdx = currentChannel;
                    mostrarOsd(ch);
                }
            } else if (k === 39 || k === 73 || k === 89) {
                // Volver a enseñar la barra sin cambiar de canal.
                mostrarOsd(channels[currentChannel]);
            } else if (k === 8 || k === 27 || k === 13) {
                showMenu();
            }
        } else if (view === "menu") {
            if (k === 38 && menuIdx > 0) { menuIdx--; renderMenu(); }
            else if (k === 40 && menuIdx < MENU.length - 1) { menuIdx++; renderMenu(); }
            else if (k === 13) elegirMenu();
            else if (k === 37 || k === 8 || k === 27) showChannels();
        } else if (view === "vod") {
            if (k === 38 && vodIdx > 0) { vodIdx--; renderVod(null); }
            else if (k === 40 && vodIdx < vod.length - 1) { vodIdx++; renderVod(null); }
            else if (k === 13) verPelicula();
            else if (k === 37 || k === 8 || k === 27) openMenu();
        } else if (view === "series") {
            if (k === 38 && serieIdx > 0) { serieIdx--; renderSeries(null); }
            else if (k === 40 && serieIdx < series.length - 1) { serieIdx++; renderSeries(null); }
            else if (k === 13) openCapitulos();
            else if (k === 37 || k === 8 || k === 27) openMenu();
        } else if (view === "capitulos") {
            if (k === 38 && capIdx > 0) { capIdx--; renderCapitulos(null); }
            else if (k === 40 && capIdx < capitulos.length - 1) { capIdx++; renderCapitulos(null); }
            else if (k === 13) verCapitulo();
            else if (k === 37 || k === 8 || k === 27) openSeries();
        } else if (view === "genres") {
            if (k === 38 && genreIdx > 0) {
                genreIdx--;
                renderGenres();
            } else if (k === 40 && genreIdx < genres.length - 1) {
                genreIdx++;
                renderGenres();
            } else if (k === 13) {
                chooseGenre();
            } else if (k === 37 || k === 8 || k === 27) {
                openMenu();
            }
        } else if (view === "guide") {
            if (k === 38 && guideIdx > 0) {
                guideIdx--;
                renderGuide();
            } else if (k === 40 && guideIdx < guide.length - 1) {
                guideIdx++;
                renderGuide();
            } else if (k === 13) {
                guideAction();
            } else if (k === 82 || k === 112) {
                recordProgram(guide[guideIdx]);
            } else if (k === 37 || k === 8 || k === 27) {
                showChannels();
            }
        } else if (view === "recordings") {
            if (k === 38 && recIdx > 0) {
                recIdx--;
                renderRecordings(null);
            } else if (k === 40 && recIdx < recordings.length - 1) {
                recIdx++;
                renderRecordings(null);
            } else if (k === 13) {
                playRecording();
            } else if (k === 82 || k === 112) {
                deleteRecording();
            } else if (k === 37 || k === 8 || k === 27) {
                showChannels();
            }
        } else {
            if (k === 38 && currentChannel > 0) {
                currentChannel--;
                showChannels();
                startPreview();
            } else if (k === 40 && currentChannel < channels.length - 1) {
                currentChannel++;
                showChannels();
                startPreview();
            } else if (k === 13 && channels.length > 0) {
                goFullscreen();
            } else if (k === 39 && channels.length > 0) {
                openGuide();
            } else if (k === 37) {
                openMenu();
            } else if (k === 82 || k === 112) {
                recordCurrent();
            } else if (k === 113 || k === 83) {
                openRecordings();
            } else if (k === 114) {
                toggleFavOnly();
            } else if (k === 115) {
                toggleFavorite();
            }
        }
        return false;
    }

    document.onkeydown = handleKey;
    window.onresize = fitScreen;
    window.onload = init;
    </script>
    <style>
        /* Identidad de Quattre: verde #81ba26 sobre carbon #2c3134, titulares en
           Antonio. Antes se usaba un verde y un azul que no eran los de la casa. */
        :root {
            --verde: #81ba26;
            --verde-claro: #9bd63a;
            --carbon: #2c3134;
            --carbon-alto: #363c40;
            --gris: #9ba3a8;
            --gris-claro: #c9d1cb;
            --rojo: #e60000;
            --ambar: #ff7900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #1e2225;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .display { font-family: Antonio, 'Segoe UI', Arial, sans-serif; letter-spacing: .5px; }

        /* ---------- Panel lateral ---------- */
        .panel {
            position: fixed; top: 3.7vh; left: 2.1vw; width: 34.4vw; height: 92.6vh;
            display: flex; flex-direction: column;
            background: rgba(44,49,52,.94);
            border-radius: 1.1vw; padding: 3vh 1.6vw;
            border: 1px solid rgba(255,255,255,.07);
            box-shadow: 0 24px 70px rgba(0,0,0,.55);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,.09);
        }
        .logo {
            font-family: Antonio, 'Segoe UI', Arial, sans-serif;
            font-size: 4.3vh; font-weight: 700; color: #fff;
            text-transform: uppercase; letter-spacing: 1px; line-height: 1;
        }
        .logo span { color: var(--verde); }
        .counter {
            background: rgba(129,186,38,.16); color: var(--verde-claro);
            padding: .8vh 1vw; border-radius: 2vh; font-size: 1.8vh; font-weight: 600;
        }

        /* ---------- Lista ---------- */
        .list { flex: 1; overflow: hidden; margin-bottom: 14px; }
        .item {
            display: flex; align-items: center; gap: 16px;
            padding: 1.3vh .9vw; margin: .65vh 0; border-radius: .7vw;
            background: rgba(255,255,255,.035);
            border-left: 4px solid transparent;
            transition: background .12s, border-color .12s;
        }
        .item.sel {
            background: linear-gradient(90deg, rgba(129,186,38,.26) 0%, rgba(129,186,38,.06) 100%);
            border-left-color: var(--verde);
        }
        .num {
            font-family: Antonio, sans-serif;
            width: 3.2vw; font-size: 2.8vh; font-weight: 600; color: #6d7679;
            text-align: right; flex-shrink: 0;
        }
        .item.sel .num { color: var(--verde); }
        .num.sm { font-size: 2vh; width: 4.4vw; color: var(--gris); }

        .ico {
            width: 2.8vw; height: 3.7vh; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,.06); border-radius: 8px; overflow: hidden;
        }
        .ico img { max-width: 100%; max-height: 100%; }

        .info { flex: 1; overflow: hidden; }
        .name {
            font-size: 2.3vh; font-weight: 500; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .epg {
            font-size: 1.6vh; color: var(--gris); margin-top: .5vh;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .epg .t { color: #6d7679; }

        /* Etiquetas */
        .hd, .rec, .live, .st {
            font-size: 1.1vh; font-weight: 700; padding: .3vh .4vw;
            border-radius: 5px; margin-left: 8px; vertical-align: middle;
            letter-spacing: .5px;
        }
        .hd   { background: rgba(255,255,255,.14); color: #fff; }
        .rec  { background: var(--rojo); color: #fff; }
        .live { background: var(--verde); color: #14210a; }
        .fav  { color: #fdeb00; font-size: 19px; margin-left: 7px; }
        .arch { color: var(--gris-claro); font-size: 19px; margin-left: 7px; }
